w{display:flex;justify-content:space-between;gap:20px;padding:5px 0}.total-row.grand{border-top:2px solid var(--strong);margin-top:5px;padding-top:10px;font:700 24px \"Barlow Condensed\"}\n    .trade-note{margin:10px 0;color:var(--muted);font-size:14px}.op-toggle{display:flex;align-items:center;gap:8px;font-weight:700}\n    .report-sheet{display:none;background:#fff;color:#172126;padding:.45in;font-family:\"Source Sans 3\",sans-serif}.letterhead{display:flex;justify-content:space-between;border-bottom:3px solid #db5f27;padding-bottom:14px}.letterhead h1{font:700 29px \"Barlow Condensed\";margin:0}.letterhead div:last-child{text-align:right;font-size:12px}.report-title{font:700 30px \"Barlow Condensed\";margin:22px 0 12px}.report-meta,.report-measures{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 18px;font-size:12px;margin-bottom:17px}.report-meta b,.report-measures b{display:block;color:#526169}.report-table{width:100%;border-collapse:collapse;font-size:11px}.report-table th{background:#27343a;color:#fff;text-align:left}.report-table th,.report-table td{padding:7px;border:1px solid #cbd3d7}.report-table td:nth-child(n+2),.report-table th:nth-child(n+2){text-align:right}.report-table .phase-row td{text-align:left;background:#edf1f2;color:#27343a;font-weight:700}.report-total{margin:13px 0 0 auto;width:280px}.notes-report{font-size:11px}.signature{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:36px}.sig-line{border-top:1px solid #172126;padding-top:5px;font-size:11px}\n    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--strong);color:var(--surface);padding:10px 16px;border-radius:7px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}\n    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n    @media(max-width:760px){\n      .app{padding:10px 10px 40px}.utility{align-items:flex-start}.privacy{display:none}.stepper{grid-template-columns:repeat(4,1fr)}.step-tab{justify-content:center;padding:10px 5px}.step-label{display:none}.grid,.grid.three,.split,.checks,.price-grid,.trace-setup,.trace-stats,.system-layers,.scope-switches,.facet-workbench,.exterior-plan-grid,.audit-list{grid-template-columns:1fr}.claim-audit-head{display:block}.audit-score{margin-top:8px}.facet-workbench .trace-tools{justify-content:flex-start}.facet-workbench .btn{flex:1 1 calc(50% - 8px)}.address-row,.map-help{grid-template-columns:1fr}.map-help .btn{width:100%}.deck-guide-head,.exterior-plan-head{display:block}.deck-guide-head .btn{margin-top:10px;width:100%}.upload{align-items:flex-start;flex-direction:column}.section-head{display:block}.report-top{display:block}.report-actions{justify-content:flex-start;margin-top:14px}.review-row{grid-template-columns:1fr 88px 92px}.review-row.head{display:none}.review-row .qty{grid-column:1}.review-row .unit{grid-column:2}.review-row .price{grid-column:3}.review-row .money{grid-column:2/4;text-align:right}.review-name{grid-column:1/4}.custom-form{grid-template-columns:1fr 1fr}.custom-form .wide{grid-column:1/3}.custom-form button{grid-column:1/3}.metric strong{font-size:29px}.report-meta,.report-measures{grid-template-columns:1fr 1fr}}\n    @media print{body{background:#fff}.app>*:not(.report-sheet){display:none!important}.app{max-width:none;padding:0}.report-sheet{display:block!important}.report-sheet{font-size:11px}.report-title{margin-top:16px}.report-table{page-break-inside:auto}.report-table tr{page-break-inside:avoid}.notes-report{page-break-inside:avoid}@page{size:letter;margin:.35in}}\n  </style>\n</head>\n<body>\n<div class=\"app\">\n  <header class=\"utility\">\n    <div><h1>Build a complete property supplement</h1><p>Capture every affected structure, trade, operation, and support item before writing the final scope.</p></div>\n    <div class=\"privacy\">Files stay in this browser session and are never uploaded.</div>\n  </header>\n\n  <nav class=\"stepper\" aria-label=\"Supplement steps\">\n    <button class=\"step-tab\" data-go=\"1\" aria-current=\"step\"><span class=\"step-num\">1</span><span class=\"step-label\">Claim</span></button>\n    <button class=\"step-tab\" data-go=\"2\"><span class=\"step-num\">2</span><span class=\"step-label\">Measurements</span></button>\n    <button class=\"step-tab\" data-go=\"3\"><span class=\"step-num\">3</span><span class=\"step-label\">Carrier</span></button>\n    <button class=\"step-tab\" data-go=\"4\"><span class=\"step-num\">4</span><span class=\"step-label\">Full scope</span></button>\n  </nav>\n\n  <main class=\"panel\">\n    <section class=\"step active\" data-step=\"1\">\n      <div class=\"section-head\"><div><h2>Claim information</h2><p>Add what you have. Every field is optional and appears on the final report.</p></div></div>\n      <div class=\"grid\">\n        <div class=\"field\"><label for=\"carrier\">Insurance carrier</label><input id=\"carrier\" autocomplete=\"organization\"></div>\n        <div class=\"field\"><label for=\"claimNo\">Claim number</label><input id=\"claimNo\"></div>\n        <div class=\"field\"><label for=\"policyholder\">Policyholder name</label><input id=\"policyholder\" autocomplete=\"name\"></div>\n        <div class=\"field address-field\"><label for=\"address\">Property address</label><div class=\"address-row\"><div class=\"address-autocomplete\"><input id=\"address\" autocomplete=\"off\" placeholder=\"Start typing a street address\" role=\"combobox\" aria-autocomplete=\"list\" aria-expanded=\"false\" aria-controls=\"addressSuggestions\"><ul class=\"address-suggestions\" id=\"addressSuggestions\" role=\"listbox\"></ul></div><button class=\"btn primary\" id=\"loadRoofMap\" type=\"button\" aria-disabled=\"true\">Load roof map</button><a class=\"btn secondary\" id=\"openMaps\" href=\"#\" target=\"_blank\" rel=\"noopener\" aria-disabled=\"true\">Open in Google Maps</a></div><p class=\"field-help\">Choose a suggested address, then load the sharpest native satellite detail available and trace the roof directly.</p></div>\n        <div class=\"field\"><label for=\"adjuster\">Adjuster name</label><input id=\"adjuster\"></div>\n        <div class=\"field\"><label for=\"yearBuilt\">Home year built</label><span class=\"parsed\" data-badge=\"yearBuilt\">Parsed from PDF</span><input id=\"yearBuilt\" type=\"number\" min=\"1800\" max=\"2100\" step=\"1\" inputmode=\"numeric\" placeholder=\"Used for lead-safe indicator\"></div>\n        <div class=\"field\"><label for=\"lossDate\">Date of loss</label><input id=\"lossDate\" type=\"date\"></div>\n        <div class=\"field\"><label for=\"lossType\">Primary cause of loss</label><select id=\"lossType\"><option value=\"\">Choose\u2026</option><option value=\"hailWind\">Hail / wind</option><option value=\"water\">Water intrusion / plumbing</option><option value=\"fireSmoke\">Fire / smoke</option><option value=\"impactTree\">Impact / fallen tree</option><option value=\"other\">Other / mixed loss</option></select></div>\n        <div class=\"field\"><label for=\"deductible\">Deductible</label><input id=\"deductible\" inputmode=\"decimal\" placeholder=\"$\"></div>\n      </div>\n      <div class=\"map-help\"><div><strong>Trace from the address\u2014no screenshot needed</strong><p>The next step loads an interactive satellite map at this address. Pan and zoom to center the roof, lock the map, then draw the perimeter, ridges, and editable facets. Pitch, roof layers, sheathing, code compliance, and hidden damage still require field or EagleView verification.</p></div><span class=\"pill\">Satellite + field check</span></div>\n      <div class=\"nav\"><span></span><button class=\"btn primary\" data-next=\"2\">Measurements \u2192</button></div>\n    </section>\n\n    <section class=\"step\" data-step=\"2\">\n      <div class=\"section-head\"><div><h2>Roof measurements</h2><p>Build the reconstruction from the deck up, then confirm every final field measurement.</p></div></div>\n      <div class=\"workflow-note\"><span class=\"workflow-mark\">DEFAULT</span><p><strong>Full affected-home reconstruction\u2014not a patch-job scope.</strong> Start with all damaged slopes and every tied roofing-system component, then narrow only when the field record supports it. EagleView, Docusketch, and the carrier estimate are optional references.</p></div>\n      <div class=\"scope-selector\"><h3>Included claim areas</h3><p class=\"subcopy\">The full-house worksheet starts with every damage area active. Uncheck only the areas the field record or claim does not support.</p><div class=\"scope-switches\"><label class=\"scope-switch\"><input id=\"scopeRoof\" type=\"checkbox\" checked><span>Roof system<small>Uncheck for a non-roof claim or when no covered roof damage is observed.</small></span></label><label class=\"scope-switch\"><input id=\"scopeExterior\" type=\"checkbox\" checked><span>Exterior<small>Siding, soffit, fascia, screens, doors, and finish.</small></span></label><label class=\"scope-switch\"><input id=\"scopeFence\" type=\"checkbox\" checked><span>Fence<small>Panels, gates, demolition, replacement, and finish.</small></span></label><label class=\"scope-switch\"><input id=\"scopeInterior\" type=\"checkbox\" checked><span>Interior<small>Mitigation, drywall, insulation, texture, and paint.</small></span></label><label class=\"scope-switch\"><input id=\"scopeOther\" type=\"checkbox\" checked><span>Other structures &amp; site<small>Detached roofs, temporary protection, tree work, and cleanup.</small></span></label></div></div>\n      <div class=\"scope-block\"><h3>Claim-wide inspection sweep</h3><p class=\"subcopy\">Give every included area a disposition. \u201cNo damage\u201d is a complete answer; a blank status is a reminder that the area still needs eyes on it.</p><div class=\"grid three\"><div class=\"field\"><label for=\"roofDamageStatus\">Roof system</label><select id=\"roofDamageStatus\"><option value=\"\">Not reviewed</option><option value=\"damage\">Damage documented</option><option value=\"noDamage\">No covered damage observed</option><option value=\"unknown\">Needs inspection / testing</option></select></div><div class=\"field\"><label for=\"exteriorDamageStatus\">Exterior elevations</label><select id=\"exteriorDamageStatus\"><option value=\"\">Not reviewed</option><option value=\"damage\">Damage documented</option><option value=\"noDamage\">No covered damage observed</option><option value=\"unknown\">Needs inspection / testing</option></select></div><div class=\"field\"><label for=\"fenceDamageStatus\">Fence</label><select id=\"fenceDamageStatus\"><option value=\"\">Not reviewed</option><option value=\"damage\">Damage documented</option><option value=\"noDamage\">No covered damage observed</option><option value=\"unknown\">Needs inspection / testing</option></select></div><div class=\"field\"><label for=\"interiorDamage\">Interior &amp; mitigation</label><select id=\"interiorDamage\"><option value=\"\">Not reviewed</option><option value=\"no\">No interior damage observed</option><option value=\"unknown\">Needs inspection / moisture testing</option><option value=\"yes\">Damage documented \u2014 build interior scope</option></select></div><div class=\"field\"><label for=\"otherDamageStatus\">Other structures &amp; site</label><select id=\"otherDamageStatus\"><option value=\"\">Not reviewed</option><option value=\"damage\">Damage documented</option><option value=\"noDamage\">No covered damage observed</option><option value=\"unknown\">Needs inspection / testing</option></select></div><div class=\"field\"><label for=\"photoSetStatus\">Photo / evidence set</label><select id=\"photoSetStatus\"><option value=\"\">Not reviewed</option><option value=\"complete\">Overview + detail photos complete</option><option value=\"partial\">Partial \u2014 more photos needed</option><option value=\"none\">No field photos yet</option></select></div><div class=\"field\"><label for=\"estimateSupportStatus\">Supporting documents</label><select id=\"estimateSupportStatus\"><option value=\"\">Not reviewed</option><option value=\"complete\">Measurements, reports, and invoices attached</option><option value=\"partial\">Some support still missing</option><option value=\"none\">No support attached yet</option></select></div></div></div>\n      <label class=\"upload\" for=\"eagleFile\"><span class=\"file-icon\">PDF</span><span><strong>Optional: upload EagleView measurement PDF</strong><span>Multi-page reports are supported. You can edit anything it fills in.</span><input id=\"eagleFile\" type=\"file\" accept=\"application/pdf,.pdf\"></span></label>\n      <div id=\"eagleStatus\" class=\"status\" role=\"status\"></div>\n      <details class=\"tracer\" id=\"facetTracer\" open>\n        <summary>Trace roof facets on the satellite map</summary>\n        <div class=\"tracer-body\">\n          <p class=\"tracer-intro\">Load the claim address, pan and zoom until the roof fills the map, then draw the outside roof perimeter and ridge lines. The app uses the map scale to calculate plan area and splits the outline into editable facets. Drag corners or add and delete facets to correct valleys, gable ends, dormers, and other roof geometry. Pitch is never inferred\u2014enter it manually or upload EagleView.</p>\n          <div class=\"trace-setup\">\n            <div class=\"field\"><label for=\"traceAddress\">Map address</label><div class=\"address-autocomplete\"><input id=\"traceAddress\" autocomplete=\"off\" placeholder=\"Start typing a street address\" role=\"combobox\" aria-autocomplete=\"list\" aria-expanded=\"false\" aria-controls=\"traceAddressSuggestions\"><ul class=\"address-suggestions\" id=\"traceAddressSuggestions\" role=\"listbox\"></ul></div></div>\n            <button class=\"btn primary\" id=\"loadTraceAddress\" type=\"button\">Load satellite</button>\n          </div>\n          <div class=\"facet-workbench\">\n            <div><strong>Draw the roof one facet at a time</strong><p>Choose Draw facet, tap each corner, then tap the first corner again or choose Finish facet. Drag corners to reshape; Undo last reverses points and edits.</p></div>\n            <div class=\"trace-tools\" aria-label=\"Primary facet controls\">\n              <button class=\"btn secondary small\" id=\"moveMap\" type=\"button\">Move / zoom map</button>\n              <button class=\"btn primary small\" id=\"addFacet\" type=\"button\">+ Add facet</button>\n              <button class=\"btn secondary small\" id=\"finishFacet\" type=\"button\">Finish facet</button>\n              <button class=\"btn secondary small\" id=\"editFacets\" type=\"button\">Drag corners</button>\n              <button class=\"btn secondary small\" id=\"addCorner\" type=\"button\">+ Add corner</button>\n              <button class=\"btn secondary small\" id=\"deleteCorner\" type=\"button\">Delete corner</button>\n              <button class=\"btn secondary small\" id=\"deleteFacet\" type=\"button\">Delete facet</button>\n              <button class=\"btn secondary small\" id=\"undoTrace\" type=\"button\" aria-keyshortcuts=\"Control+Z Meta+Z\" disabled>Undo last</button>\n            </div>\n          </div>\n          <details class=\"quick-split\">\n            <summary>Fast start: draw a perimeter and ridges, then split into facets</summary>\n            <div class=\"trace-tools\" aria-label=\"Automatic facet tracing controls\">\n              <button class=\"btn secondary small\" id=\"drawPerimeter\" type=\"button\">Draw perimeter</button>\n              <button class=\"btn secondary small\" id=\"finishPerimeter\" type=\"button\">Finish perimeter</button>\n              <button class=\"btn secondary small\" id=\"drawRidge\" type=\"button\">Draw ridge lines</button>\n              <button class=\"btn primary small\" id=\"splitFacets\" type=\"button\">Split into facets</button>\n            </div>\n          </details>\n          <div class=\"trace-stage\" id=\"traceStage\"><div id=\"roofMap\" aria-label=\"Interactive satellite map\"></div><canvas id=\"traceCanvas\" tabindex=\"0\" aria-label=\"Roof tracing layer. Tap to place precise facet corners, drag corners to edit, and use Undo last or Control Z to reverse changes.\"></canvas><div class=\"trace-empty\" id=\"traceEmpty\">Enter the property address and choose Load satellite.</div></div>\n          <div class=\"trace-key\" aria-hidden=\"true\"><span><i></i>Perimeter / working line</span><span><i class=\"ridge\"></i>Ridge</span><span><i class=\"facet\"></i>Editable facet</span></div>\n          <div class=\"trace-tools break\" aria-label=\"Trace reset controls\">\n            <button class=\"btn secondary small\" id=\"clearTrace\" type=\"button\">Clear tracing</button>\n          </div>\n          <div class=\"trace-stats\">\n            <div class=\"trace-stat\"><span>Editable facets</span><strong id=\"traceFacetCount\">0</strong></div>\n            <div class=\"trace-stat\"><span>Flat plan area</span><strong id=\"tracePlanArea\">\u2014</strong></div>\n            <div class=\"trace-stat\"><span>Pitch-adjusted area</span><strong id=\"traceSlopedArea\">\u2014</strong></div>\n          </div>\n          <div class=\"facet-roster\" id=\"facetRoster\" aria-label=\"Drawn facets\"></div>\n          <p class=\"trace-status\" id=\"traceStatus\" role=\"status\">Load the property address, then center the roof before drawing.</p>\n          <div class=\"trace-tools\"><button class=\"btn primary small\" id=\"useTraceArea\" type=\"button\">Use traced roof area</button></div>\n        </div>\n      </details>\n      <div class=\"split\">\n        <div>\n          <div class=\"grid three\">\n            <div class=\"field\"><label for=\"reconstructionScope\">Reconstruction posture</label><select id=\"reconstructionScope\"><option value=\"fullHome\" selected>Full affected-home reconstruction</option><option value=\"fullRoof\">Full roof system</option><option value=\"partial\">Partial scope \u2014 field-documented exception</option></select></div>\n            <div class=\"field\"><label for=\"roofArea\">Roof area (sq ft)</label><span class=\"parsed\" data-badge=\"roofArea\">Parsed from PDF</span><input id=\"roofArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n            <div class=\"field\"><label for=\"pitch\">Predominant pitch</label><span class=\"parsed\" data-badge=\"pitch\">Parsed from PDF</span><input id=\"pitch\" placeholder=\"7/12\"></div>\n            <div class=\"field\"><label for=\"lowSlopeArea\">Low-slope area \u22644/12 (sq ft)</label><input id=\"lowSlopeArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Enter only the affected low-slope facets; leave blank to use the full roof when the predominant pitch is 4/12 or less.</p></div>\n            <div class=\"field\"><label for=\"steepSlopeArea\">Steep area \u22657/12 (sq ft)</label><input id=\"steepSlopeArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Enter only the affected steep facets; leave blank to use the full roof when the predominant pitch is 7/12 or more.</p></div>\n            <div class=\"field\"><label for=\"facets\">Total roof facets</label><span class=\"parsed\" data-badge=\"facets\">Parsed from PDF</span><input id=\"facets\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n            <div class=\"field\"><label for=\"ridges\">Ridges (LF)</label><span class=\"parsed\" data-badge=\"ridges\">Parsed from PDF</span><input id=\"ridges\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n            <div class=\"field\"><label for=\"hips\">Hips (LF)</label><span class=\"parsed\" data-badge=\"hips\">Parsed from PDF</span><input id=\"hips\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n            <div class=\"field\"><label for=\"valleys\">Valleys (LF)</label><span class=\"parsed\" data-badge=\"valleys\">Parsed from PDF</span><input id=\"valleys\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n            <div class=\"field\"><label for=\"rakes\">Rakes (LF)</label><span class=\"parsed\" data-badge=\"rakes\">Parsed from PDF</span><input id=\"rakes\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n            <div class=\"field\"><label for=\"eaves\">Eaves (LF)</label><span class=\"parsed\" data-badge=\"eaves\">Parsed from PDF</span><input id=\"eaves\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n            <div class=\"field\"><label for=\"stories\">Number of stories</label><span class=\"parsed\" data-badge=\"stories\">Parsed from PDF</span><input id=\"stories\" type=\"number\" min=\"1\" step=\"1\" inputmode=\"numeric\"></div>\n            <div class=\"field\"><label for=\"atticArea\">Estimated attic area (sq ft)</label><span class=\"parsed\" data-badge=\"atticArea\">Parsed from PDF</span><input id=\"atticArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Used as the EagleView reference for ventilation review; field-verify the actual ventilated attic area.</p></div>\n            <div class=\"field\"><label for=\"lowSlopeAssembly\">Low-slope dry-in assembly</label><select id=\"lowSlopeAssembly\"><option value=\"double\" selected>Double-layer underlayment at 4/12 or less</option><option value=\"fullIce\">Underlayment + full-deck ice &amp; water barrier</option><option value=\"standard\">Standard single layer \u2014 field-documented exception</option></select><p class=\"field-help\">Applied only to the measured low-slope area; the full roof is used only when the predominant pitch is 4/12 or less and no separate area is entered.</p></div>\n            <div class=\"field\"><label for=\"steepPolicy\">Steep-roof charge</label><select id=\"steepPolicy\"><option value=\"auto\" selected>Auto \u2014 carry at 7/12 and above</option><option value=\"yes\">Carry steep charge</option><option value=\"no\">Do not carry steep charge</option></select><p class=\"field-help\">Use the verified pitch, access, handling, and fall-protection setup.</p></div>\n          </div>\n          <div class=\"deck-callout\" id=\"slopeAdvice\" role=\"status\"><strong>Enter the verified pitch</strong><p>The worksheet will apply the low-slope dry-in assembly at 4/12 or less and recommend steep-roof labor at 7/12 or above. Override either decision when the field record supports it.</p></div>\n          <div class=\"conditions\">\n            <h3>Job conditions</h3>\n            <div class=\"grid\">\n              <div class=\"field\"><label for=\"shingleType\">Existing shingle type</label><select id=\"shingleType\"><option value=\"\">Choose\u2026</option><option value=\"3tab\">3-tab</option><option value=\"architectural\">Architectural</option><option value=\"unknown\">Unknown</option></select></div>\n              <div class=\"field\"><label for=\"roofLayers\">Existing roof layers</label><select id=\"roofLayers\"><option value=\"\">Choose\u2026</option><option value=\"1\">1 layer</option><option value=\"2\">2 layers</option><option value=\"3\">3 or more layers</option><option value=\"unknown\">Unknown \u2014 verify at edge or tear-off</option></select></div>\n              <div class=\"field\"><label for=\"pipes\">Plumbing pipes / vents</label><input id=\"pipes\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              <div class=\"field\"><label for=\"exhausts\">Exhaust vents</label><input id=\"exhausts\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              <div class=\"field\"><label for=\"chimneys\">Chimneys</label><input id=\"chimneys\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              <div class=\"field\" id=\"chimneyWidthWrap\" hidden><label for=\"chimneyWidth\">Widest chimney across slope (inches)</label><input id=\"chimneyWidth\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Measure perpendicular to the roof slope. A cricket / saddle review triggers above 30 inches.</p></div>\n              <div class=\"field\"><label for=\"skylights\">Skylights</label><input id=\"skylights\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              <div class=\"field\"><label for=\"roofWall\">Roof-to-wall flashing (LF)</label><input id=\"roofWall\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\" inputmode=\"decimal\"></div>\n              <div class=\"field\"><label for=\"satellite\">Satellite dish</label><select id=\"satellite\"><option value=\"\">Choose\u2026</option><option value=\"no\">No</option><option value=\"yes\">Yes \u2014 detach & reset</option></select></div>\n              <div class=\"field\"><label for=\"solar\">Solar panels</label><select id=\"solar\"><option value=\"\">Choose\u2026</option><option value=\"no\">No</option><option value=\"yes\">Yes \u2014 detach & reset</option></select></div>\n              <div class=\"field\" id=\"solarCountWrap\" hidden><label for=\"solarCount\">Solar panel count</label><input id=\"solarCount\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              <div class=\"field\"><label for=\"gutters\">Gutters detach needed</label><select id=\"gutters\"><option value=\"\">Choose\u2026</option><option value=\"no\">No</option><option value=\"yes\">Yes</option></select></div>\n            </div>\n            <div class=\"deck-guide\">\n              <div class=\"deck-guide-head\"><div><h3>Roof deck / sheathing decision</h3><p>Separate what the deck is, what you observed, and what the repair scope actually is. Satellite imagery cannot answer these questions.</p></div><button class=\"btn secondary small\" id=\"useDeckRecommendation\" type=\"button\">Use recommended scope</button></div>\n              <div class=\"grid\">\n                <div class=\"field\"><label for=\"deckType\">Existing deck type</label><select id=\"deckType\"><option value=\"\">Choose\u2026</option><option value=\"unknown\">Unknown / not exposed</option><option value=\"osb\">OSB panels</option><option value=\"plywood\">Plywood panels</option><option value=\"solidPlank\">Solid 1\u00d7 plank boards</option><option value=\"spacedPlank\">Spaced plank / skip sheathing</option><option value=\"mixed\">Mixed materials</option></select></div>\n                <div class=\"field\"><label for=\"deckCondition\">Observed condition</label><select id=\"deckCondition\"><option value=\"\">Choose\u2026</option><option value=\"unknown\">Not inspected yet</option><option value=\"serviceable\">Serviceable and fastened</option><option value=\"loose\">Serviceable but needs re-fastening</option><option value=\"spotDamage\">Localized rot / damage</option><option value=\"widespread\">Widespread deterioration or non-nailable surface</option></select></div>\n                <div class=\"field\"><label for=\"deckAction\">Planned deck scope</label><select id=\"deckAction\"><option value=\"inspect\">Inspect after tear-off \u2014 no quantity yet</option><option value=\"none\">No deck work</option><option value=\"renail\">Re-fasten existing deck</option><option value=\"spotRepair\">Replace damaged area only</option><option value=\"fullRedeck\">Full overlay / redeck</option></select></div>\n                <div class=\"field\"><label for=\"deckThickness\">Replacement thickness</label><select id=\"deckThickness\"><option value=\"\">Choose after verification\u2026</option><option value=\"7/16 OSB\">7/16 in OSB</option><option value=\"1/2 plywood\">1/2 in plywood</option><option value=\"5/8 plywood\">5/8 in plywood</option><option value=\"other\">Other \u2014 note in custom line</option></select></div>\n                <div class=\"field\" id=\"deckRepairAreaWrap\" hidden><label for=\"deckRepairArea\">Damaged area to replace (sq ft)</label><input id=\"deckRepairArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Measure the documented damaged area; the sheet count rounds up and applies waste.</p></div>\n              </div>\n              <div class=\"deck-callout\" id=\"deckAdvice\" role=\"status\"><strong>Start with an inspection</strong><p>If the deck is not exposed, do not assume a full redeck. Photograph the attic where accessible, check eaves or penetrations, and confirm after tear-off.</p></div>\n            </div>\n            <div class=\"scope-block\">\n              <h3>Debris, site access &amp; code coverage</h3>\n              <p class=\"subcopy\">Price the work that makes the reconstruction possible\u2014not just the installed materials. Confirm disposal, sanitation, access, and ordinance-or-law coverage before the supplement goes out.</p>\n              <div class=\"grid\">\n                <div class=\"field\"><label for=\"debrisPlan\">Tear-off debris plan</label><select id=\"debrisPlan\"><option value=\"\">Choose\u2026</option><option value=\"dumpster\">On-site dumpster</option><option value=\"trailer\">Dump trailer / staged haul-off</option><option value=\"direct\">Direct load and haul</option><option value=\"unknown\">Not planned yet</option></select></div>\n                <div class=\"field\"><label for=\"jobDays\">Expected project duration (days)</label><input id=\"jobDays\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"crewSize\">Expected crew size</label><input id=\"crewSize\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"siteSanitation\">Portable restroom / site sanitation</label><select id=\"siteSanitation\"><option value=\"\">Choose\u2026</option><option value=\"no\">Not needed \u2014 facilities confirmed</option><option value=\"yes\">Needed for this job</option><option value=\"verify\">Verify before mobilization</option></select></div>\n                <div class=\"field\" id=\"portableRestroomsWrap\" hidden><label for=\"portableRestrooms\">Portable restrooms (EA)</label><input id=\"portableRestrooms\" type=\"number\" min=\"1\" step=\"1\" value=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"materialLift\">Roof material loading equipment</label><select id=\"materialLift\"><option value=\"\">Choose\u2026</option><option value=\"verify\">Review site access</option><option value=\"telehandler\">Add telehandler (telescopic boom forklift)</option><option value=\"none\">Ground handling only</option></select><p class=\"field-help\">Use a telehandler when its reach and rated capacity support safer, faster placement of roofing materials at roof level. Confirm access, ground conditions, operator, and lift plan.</p></div>\n                <div class=\"field\" id=\"telehandlerDaysWrap\" hidden><label for=\"telehandlerDays\">Telehandler rental (days)</label><input id=\"telehandlerDays\" type=\"number\" min=\"1\" step=\"1\" value=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"codeCoverage\">Ordinance or law / code-upgrade coverage</label><select id=\"codeCoverage\"><option value=\"\">Choose\u2026</option><option value=\"included\">Included \u2014 verify limit</option><option value=\"limited\">Limited \u2014 document available amount</option><option value=\"excluded\">Excluded / not endorsed</option><option value=\"unknown\">Unknown \u2014 review policy</option></select></div>\n              </div>\n              <div class=\"deck-callout\" id=\"siteAdvice\" role=\"status\"><strong>Plan disposal and site support</strong><p>Carry tear-off loading, transport, container or trailer charges, dump fees, and final cleanup as supported by the job. Verify restroom needs from project duration, crew size, access, and available facilities.</p></div>\n              <div class=\"hazard-note\" id=\"codeCoverageNote\">Code still governs the installation; policy coverage determines who pays for eligible upgrades. Verify the policy endorsement and limits instead of assuming coverage, and explain any gap to the insured before the next renewal.</div>\n            </div>\n            <div class=\"scope-block scope-section\" data-scope-section=\"other\">\n              <h3>Other structures, emergency work &amp; site damage</h3>\n              <p class=\"subcopy\">Capture work that sits outside the main dwelling before it disappears between trades. Use measured quantities; each populated field creates its own operation in the build sequence.</p>\n              <div class=\"grid\">\n                <div class=\"field\"><label for=\"emergencyTarpArea\">Emergency tarp / temporary roof protection (SF)</label><input id=\"emergencyTarpArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"detachedRoofArea\">Detached structure roof area (SF)</label><input id=\"detachedRoofArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Garage, shop, shed, gazebo, or other separate roof. Do not combine it with the dwelling roof area.</p></div>\n                <div class=\"field\"><label for=\"detachedRoofLayers\">Detached roof layers</label><select id=\"detachedRoofLayers\"><option value=\"\">Choose\u2026</option><option value=\"1\">1 layer</option><option value=\"2\">2 layers</option><option value=\"3\">3 or more layers</option><option value=\"unknown\">Unknown \u2014 verify</option></select></div>\n                <div class=\"field\"><label for=\"detachedSidingArea\">Detached structure siding (SF)</label><input id=\"detachedSidingArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"treeRemoval\">Storm-damaged trees / limbs to remove (EA)</label><input id=\"treeRemoval\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"siteCleanupHours\">Specialty site cleanup labor (hours)</label><input id=\"siteCleanupHours\" type=\"number\" min=\"0\" step=\"0.5\" inputmode=\"decimal\"></div>\n              </div>\n              <div class=\"deck-callout\"><strong>Keep each structure and emergency operation separate</strong><p>Photograph the whole site, label each structure, measure each roof and elevation independently, and separate emergency protection, tree work, demolition, rebuilding, hauling, and final cleanup.</p></div>\n            </div>\n            <div class=\"scope-block scope-section\" data-scope-section=\"exterior\">\n              <h3>Wood patio / deck reconstruction</h3>\n              <p class=\"subcopy\">This is the outdoor structure\u2014not roof sheathing. Document whether roofing work only needs surface protection or whether the loss requires board, railing, stair, or framing reconstruction.</p>\n              <div class=\"grid\">\n                <div class=\"field\"><label for=\"woodStructure\">Outdoor wood structure</label><select id=\"woodStructure\"><option value=\"\">Choose\u2026</option><option value=\"none\">None observed</option><option value=\"patio\">Ground-level wood patio / platform</option><option value=\"deck\">Elevated deck</option><option value=\"both\">Patio and deck</option><option value=\"unknown\">Possible \u2014 verify in field</option></select></div>\n                <div class=\"field\"><label for=\"coveredWood\">Roof covering over it</label><select id=\"coveredWood\"><option value=\"\">Choose\u2026</option><option value=\"no\">No</option><option value=\"yes\">Yes \u2014 include its roof facets in the trace</option><option value=\"unknown\">Unknown \u2014 verify from imagery / field</option></select></div>\n                <div class=\"field\"><label for=\"woodCondition\">Observed condition</label><select id=\"woodCondition\"><option value=\"\">Choose\u2026</option><option value=\"unknown\">Not inspected yet</option><option value=\"serviceable\">Serviceable \u2014 protect during roofing</option><option value=\"surfaceDamage\">Damaged deck / patio boards</option><option value=\"railDamage\">Damaged railing or stairs</option><option value=\"structuralDamage\">Posts, beams, or joists affected</option><option value=\"mixedDamage\">Multiple damaged components</option></select></div>\n                <div class=\"field\"><label for=\"woodAction\">Planned scope</label><select id=\"woodAction\"><option value=\"inspect\">Inspect / document \u2014 no reconstruction yet</option><option value=\"protect\">Protect during roofing only</option><option value=\"surfaceRepair\">Repair or replace deck surface</option><option value=\"partialRebuild\">Partial structural reconstruction</option><option value=\"fullRebuild\">Full reconstruction</option></select></div>\n                <div class=\"field\" data-wood-qty><label for=\"woodDeckArea\">Deck / patio surface (SF)</label><input id=\"woodDeckArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Measure the affected or protected walking surface.</p></div>\n                <div class=\"field\" data-wood-qty><label for=\"woodRailing\">Railing (LF)</label><input id=\"woodRailing\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n                <div class=\"field\" data-wood-qty><label for=\"woodPosts\">Posts (EA)</label><input id=\"woodPosts\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\" data-wood-qty><label for=\"woodStairs\">Stair assemblies (EA)</label><input id=\"woodStairs\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              </div>\n              <div class=\"deck-callout\" id=\"woodAdvice\" role=\"status\"><strong>Keep patio/deck scope separate</strong><p>Photograph all sides, measure the walking surface and railing, and document attachment to the house. Do not mix outdoor deck reconstruction with roof sheathing quantities.</p></div>\n            </div>\n            <div class=\"scope-block scope-section\" data-scope-section=\"exterior\">\n              <h3>Exterior elevations</h3>\n              <p class=\"subcopy\">EagleView creates the best available exterior starting plan from explicit wall measurements and roof-edge geometry. Confirm each affected elevation and component in the field before export.</p>\n              <div class=\"exterior-plan\" id=\"exteriorPlan\" aria-live=\"polite\">\n                <div class=\"exterior-plan-head\"><div><h4>EagleView-informed exterior plan</h4><p id=\"exteriorPlanText\">Upload a measurement report or enter eaves, rakes, and stories to build the roofline access plan.</p></div><span class=\"pill\" id=\"exteriorPlanSource\">Awaiting measurements</span></div>\n                <div class=\"exterior-plan-grid\"><div class=\"exterior-plan-metric\"><span>Roofline edge</span><strong id=\"extPlanEdge\">\u2014</strong></div><div class=\"exterior-plan-metric\"><span>Gutter / eave run</span><strong id=\"extPlanGutters\">\u2014</strong></div><div class=\"exterior-plan-metric\"><span>Rake trim run</span><strong id=\"extPlanRakes\">\u2014</strong></div><div class=\"exterior-plan-metric\"><span>Access height</span><strong id=\"extPlanStories\">\u2014</strong></div></div>\n              </div>\n              <div class=\"lead-indicator\" id=\"leadIndicator\" role=\"status\"><strong>Lead-paint indicator: year built needed</strong><p>Enter the home\u2019s year built. Pre-1978 work that disturbs painted surfaces triggers an EPA RRP lead-safe compliance review and related scope lines.</p></div>\n              <div class=\"grid\">\n                <div class=\"field\"><label for=\"sidingArea\">Damaged siding (SF)</label><span class=\"parsed\" data-badge=\"sidingArea\">Parsed from PDF</span><input id=\"sidingArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"soffitArea\">Damaged soffit (SF)</label><span class=\"parsed\" data-badge=\"soffitArea\">Parsed from PDF</span><input id=\"soffitArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"fasciaLength\">Exterior fascia / roofline trim plan (LF)</label><span class=\"parsed\" data-badge=\"fasciaLength\">EagleView-derived plan</span><input id=\"fasciaLength\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"windowScreens\">Window screens (EA)</label><input id=\"windowScreens\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"garageDoorPanels\">Garage door panels (EA)</label><input id=\"garageDoorPanels\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"exteriorPaintArea\">Exterior finish / paint (SF)</label><input id=\"exteriorPaintArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"exteriorPaintColors\">Exterior paint colors</label><input id=\"exteriorPaintColors\" type=\"number\" min=\"1\" step=\"1\" inputmode=\"numeric\" placeholder=\"1\"><p class=\"field-help\">Each additional color creates its own setup / cut-in line.</p></div>\n                <div class=\"field\"><label for=\"exteriorGutterLength\">Gutter run plan (LF)</label><span class=\"parsed\" data-badge=\"exteriorGutterLength\">EagleView-derived plan</span><input id=\"exteriorGutterLength\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"exteriorDownspoutLength\">Damaged downspouts to replace (LF)</label><span class=\"parsed\" data-badge=\"exteriorDownspoutLength\">Parsed from PDF</span><input id=\"exteriorDownspoutLength\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"exteriorFixtures\">Exterior electrical fixtures D&amp;R (EA)</label><input id=\"exteriorFixtures\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"exteriorWindowGlazing\">Damaged window glazing / sash (EA)</label><input id=\"exteriorWindowGlazing\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"exteriorDoors\">Damaged exterior doors (EA)</label><input id=\"exteriorDoors\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"exteriorMasonryArea\">Masonry / stucco repair (SF)</label><input id=\"exteriorMasonryArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"exteriorHvacUnits\">HVAC condenser units affected (EA)</label><input id=\"exteriorHvacUnits\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n              </div>\n              <div class=\"deck-callout\"><strong>Build by elevation, operation, and trade</strong><p>Removal, replacement, masking, primer, each finish color, electrical detach/reset, glazing, gutters, masonry, HVAC, access, and disposal remain separate supported line items. Photograph elevations straight-on and include closeups of each hail impact or fracture pattern.</p></div>\n            </div>\n            <div class=\"scope-block scope-section\" data-scope-section=\"fence\">\n              <h3>Fence reconstruction</h3>\n              <p class=\"subcopy\">Keep fence work independent from the house elevations and quantify only the damaged runs, gates, and finish.</p>\n              <div class=\"grid\">\n                <div class=\"field\"><label for=\"fenceLength\">Damaged fence run (LF)</label><input id=\"fenceLength\" type=\"number\" min=\"0\" step=\"0.1\" inputmode=\"decimal\"></div>\n                <div class=\"field\"><label for=\"fenceHeight\">Fence height</label><select id=\"fenceHeight\"><option value=\"6\" selected>6 ft</option><option value=\"4\">4 ft</option><option value=\"8\">8 ft</option><option value=\"other\">Other \u2014 use custom line</option></select></div>\n                <div class=\"field\"><label for=\"fenceGates\">Damaged gates (EA)</label><input id=\"fenceGates\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\"><label for=\"fenceFinishArea\">Fence stain / finish (SF)</label><input id=\"fenceFinishArea\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"decimal\"><p class=\"field-help\">Use both faces only when both are included in the supported scope.</p></div>\n              </div>\n              <div class=\"deck-callout\"><strong>Scope the affected run\u2014not a generic fence total</strong><p>Document material, height, post spacing, cap or trim, gate hardware, finish, demolition access, and whether undamaged tie-in sections can remain.</p></div>\n            </div>\n            <div class=\"scope-block scope-section\" data-scope-section=\"interior\">\n              <h3>Interior leak scope</h3>\n              <p class=\"subcopy\">Answer the field questions first. The review will turn the answers into a visible interior and mitigation checklist.</p>\n              <div class=\"grid\">\n                <div class=\"field\" data-interior><label for=\"activeLeak\">Active or recently wet</label><select id=\"activeLeak\"><option value=\"\">Choose\u2026</option><option value=\"no\">No / dry</option><option value=\"yes\">Yes</option></select></div>\n                <div class=\"field\" data-interior><label for=\"roomsAffected\">Rooms affected</label><input id=\"roomsAffected\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\"></div>\n                <div class=\"field\" data-interior><label for=\"ceilingType\">Ceiling type / access</label><select id=\"ceilingType\"><option value=\"\">Choose\u2026</option><option value=\"flat\">Flat / standard height</option><option value=\"vaulted\">Vaulted, cathedral, or high c
