<script>// High Ground HQ — PDF text parsers (EagleView + Xactimate).
// Text extraction itself is done with pdfjs-dist in the renderer; these
// functions turn raw text into structured data. Best-effort by design —
// every field lands in an editable form before it feeds the engine.
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.HQParsers = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function num(rx, text, group = 1) {
    const m = text.match(rx);
    if (!m) return 0;
    return parseFloat(String(m[group]).replace(/,/g, '')) || 0;
  }
  function str(rx, text, group = 1) {
    const m = text.match(rx);
    return m ? String(m[group]).trim() : '';
  }

  // ---- EagleView ---------------------------------------------------------
  // Handles the standard EagleView measurement report layout, including the
  // waste-factor table where the "Suggested" label sits under the suggested
  // column (the fix from 2026-09-24: never hardcode 9% vs 11%).
  function parseEagleViewText(text) {
    const t = text.replace(/\r/g, '\n');
    const raw = {
      totalSqFt: num(/total roof area[:\s]+([\d,]+)\s*sq\.?\s*ft/i, t),
      pitch: str(/predominant pitch[:\s]+(\d+\s*\/\s*\d+)/i, t),
      ridgesLF: num(/ridges?[:\s]+([\d,.]+)\s*ft/i, t),
      hipsLF: num(/hips?[:\s]+([\d,.]+)\s*ft/i, t),
      valleysLF: num(/valleys?[:\s]+([\d,.]+)\s*ft/i, t),
      rakesLF: num(/rakes?[:\s]+([\d,.]+)\s*ft/i, t),
      eavesLF: num(/eaves?[:\s]+([\d,.]+)\s*ft/i, t),
      stepFlashingLF: num(/step flashing[:\s]+([\d,.]+)\s*ft/i, t),
    };
    raw.wastePct = detectWastePct(t);
    const found = Object.entries(raw).filter(([, v]) => v).map(([k]) => k);
    return { raw, found, confidence: found.length >= 4 ? 'good' : 'partial' };
  }

  function detectWastePct(t) {
    // Find "Suggested" near the waste table, then take the % value closest
    // to it (the column header it sits under).
    const idx = t.search(/suggested/i);
    if (idx === -1) return 10;
    const window = t.slice(Math.max(0, idx - 400), idx + 120);
    let best = null;
    let bestDist = Infinity;
    const re = /(\d{1,2})\s*%/g;
    let m;
    while ((m = re.exec(window))) {
      const pct = parseInt(m[1], 10);
      if (pct < 3 || pct > 30) continue;
      const d = Math.abs(m.index - (idx - Math.max(0, idx - 400)));
      if (d < bestDist) { bestDist = d; best = pct; }
    }
    return best || 10;
  }

  // ---- Xactimate (adjuster's estimate) -----------------------------------
  // Pulls RFG line items out of the estimate text and reports which
  // supplement items the adjuster already covered vs. missed.
  function parseXactimateText(text) {
    const t = text.replace(/\r/g, '\n');
    const items = [];
    const re = /(RFG\s*\d{3})\s+([^\n]{4,80}?)\s+([\d,.]+\s*(?:SQ|LF|EA))\s+\$?([\d,.]+)\s+\$?([\d,.]+)/gi;
    let m;
    while ((m = re.exec(t))) {
      items.push({
        code: m[1].replace(/\s+/g, ' ').trim(),
        desc: m[2].trim(),
        qty: m[3].trim(),
        price: parseFloat(m[4].replace(/,/g, '')) || 0,
        total: parseFloat(m[5].replace(/,/g, '')) || 0,
      });
    }
    const claimNumber = str(/claim (?:number|#)[:\s]+([A-Za-z0-9-]+)/i, t);
    const insured = str(/(?:policyholder|insured)[:\s]+([^\n]+)/i, t);
    return { items, claimNumber, insured: insured.trim(), rawText: t.slice(0, 20000) };
  }

  return { parseEagleViewText, parseXactimateText };
});
</script>
<script>// High Ground HQ — app shell: router, helpers, shared state.
// Views register themselves in window.VIEWS = { name: {title, render(el, arg), actions()} }.
(function () {
  'use strict';

  window.VIEWS = {};
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function h(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function money(n) {
    return '$' + (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(s) {
    if (!s) return '—';
    const d = new Date(String(s).replace(' ', 'T'));
    return isNaN(d) ? h(s) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function badge(text) {
    const cls = 'b-' + String(text || '').toLowerCase().replace(/[^a-z]/g, '');
    return `<span class="badge ${cls}">${h(text)}</span>`;
  }

  // Cloud backend (Supabase). db-cloud.js must load before this file.
  const db = window.HQ_CLOUD_DB;

  // Shared state: company settings + price book, loaded once at boot.
  const S = { settings: {}, priceBook: {}, ready: false, user: null };

  async function loadSettings() {
    const rows = await db.list('settings');
    S.settings = {};
    for (const r of rows) S.settings[r.key] = r.value;
    try { S.priceBook = JSON.parse(S.settings.price_book || '{}'); }
    catch (e) { S.priceBook = {}; }
    S.ready = true;
  }
  async function savePriceBook() {
    await db.upsert('settings', { key: 'price_book', value: JSON.stringify(S.priceBook) }, 'key');
  }
  async function saveSetting(key, value) {
    S.settings[key] = value;
    await db.upsert('settings', { key, value }, 'key');
  }

  const TITLES = {
    dashboard: 'Dashboard', leads: 'Leads', jobs: 'Jobs', estimates: 'Estimates',
    comms: 'Comms — drafts & outreach', campaigns: 'Neighborhood campaigns', settings: 'Settings',
    flyer: 'Neighborhood flyer', hailscope: 'HailScope', photos: 'Photos',
  };

  let current = 'dashboard';
  let currentArg = null;

  async function go(view, arg) {
    current = view; currentArg = arg === undefined ? null : arg;
    $$('#nav button').forEach((b) => {
      const on = b.dataset.view === view;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    $('#view-title').textContent = TITLES[view] || view;
    const V = window.VIEWS[view];
    const bar = $('#topbar-actions');
    bar.innerHTML = (V && V.actions) ? V.actions(arg) : '';
    if (V && V.bindActions) V.bindActions(bar, arg);
    const el = $('#view');
    el.innerHTML = '<p class="muted">Loading…</p>';
    try {
      await V.render(el, arg);
    } catch (err) {
      el.innerHTML = `<div class="panel"><h2>Something broke</h2><p class="muted">${h(err.message)}</p></div>`;
      console.error(err);
    }
  }

  // Merge-field templates for AI-assisted drafts (free tier: templates +
  // "copy prompt for Muse" loop; Twilio/Gmail send wired later by the owner).
  const TEMPLATES = [
    { id: 'neighbor_done_email', kind: 'email', name: 'Email — we just finished your neighbor\u2019s roof',
      subject: 'We just finished a roof on {{street}} — free inspection?',
      body: 'Hi {{name}},\n\nThis is Josh with High Ground Roofing & Construction. We just wrapped a full roof replacement at {{job_address}}, right near you.\n\nAfter the May hail, a lot of roofs on {{street}} took damage that isn\u2019t visible from the ground. We do free 15-minute inspections with drone photos and handle the insurance paperwork if there\u2019s a claim to file.\n\nWant me to swing by this week?\n\n— Josh\nHigh Ground Roofing & Construction\n{{company_phone}}' },
    { id: 'hail_check_text', kind: 'text', name: 'Text — hail damage check',
      subject: '',
      body: 'Hi {{name}}, Josh with High Ground Roofing. We just finished a roof near {{job_address}} and several homes nearby took hail in the May storm. Free 15-min drone inspection — want me to stop by this week? Reply STOP to opt out.' },
    { id: 'inspection_offer_email', kind: 'email', name: 'Email — free inspection offer',
      subject: 'Free roof inspection — {{address}}',
      body: 'Hi {{name}},\n\nQuick one: I\u2019m Josh with High Ground Roofing & Construction here in OKC. We\u2019re offering free drone roof inspections in {{city}} this month — takes 15 minutes, photos included, no obligation.\n\nIf your roof took any of the spring hail, catching it early is what makes the difference with insurance.\n\nOpen to a quick look?\n\n— Josh\n{{company_phone}}' },
    { id: 'claim_followup_email', kind: 'email', name: 'Email — claim / supplement follow-up',
      subject: 'Update on your roof claim {{claim_number}}',
      body: 'Hi {{name}},\n\nFollowing up on your roof claim {{claim_number}} ({{carrier}}). {{custom}}\n\nI\u2019ll keep you posted at every step — reply here or call me anytime at {{company_phone}}.\n\n— Josh\nHigh Ground Roofing & Construction' },
    { id: 'call_script', kind: 'call', name: 'Call script — cold / follow-up',
      subject: 'Call script',
      body: 'Opener: "Hi {{name}}, this is Josh with High Ground Roofing here in OKC — do you have 30 seconds?"\n\nHook: "We just finished a roof over at {{job_address}} and I\u2019m checking the homes nearby for the same hail damage — most of it you can\u2019t see from the ground."\n\nAsk: "We do a free 15-minute drone inspection with photos — would Thursday or Friday work better for a quick look?"\n\nObjections:\n- "Not interested" → "Totally fair — if you spot granules in the gutters or a leak after the next rain, call me direct at {{company_phone}}."\n- "I have a guy" → "Good — just know we handle the insurance paperwork end to end if it ever comes to that."\n\nLog the outcome below after the call.' },
  ];

  function fillTemplate(tpl, ctx) {
    const c = Object.assign({
      name: '', address: '', street: '', city: 'Oklahoma City', zip: '',
      job_address: '', claim_number: '', carrier: '', custom: '',
      company_phone: S.settings.company_phone || '',
      company_name: S.settings.company_name || '',
    }, ctx || {});
    const fill = (s) => String(s).replace(/\{\{(\w+)\}\}/g, (_, k) => c[k] != null ? c[k] : '');
    return { subject: fill(tpl.subject), body: fill(tpl.body) };
  }

  function aiPromptForDraft(kind, subject, body, ctx) {
    return 'You are helping Josh at High Ground Roofing & Construction (OKC, (405) 252-0058) write a ' + kind +
      ' to a roofing customer/lead.\n\nContext:\n' + JSON.stringify(ctx || {}, null, 2) +
      '\n\nCurrent draft' + (subject ? ' (subject: ' + subject + ')' : '') + ':\n' + body +
      '\n\nRewrite it in Josh\u2019s voice: plain, direct, neighborly, zero hype. Keep it short. ' +
      'For texts: under 320 characters and end with "Reply STOP to opt out." ' +
      'For emails: clear subject line, one ask. For call scripts: opener, hook, ask, two objection handlers. ' +
      'Return ONLY the rewritten ' + kind + ' (and subject line first for emails).';
  }

  window.HQ = { $, $$, h, money, fmtDate, badge, db, S, loadSettings, savePriceBook, saveSetting, go, TEMPLATES, fillTemplate, aiPromptForDraft,
    auth: {
      signOut: () => db.signOut().then(() => location.reload()),
    },
    docs: docsStore() };

  // IndexedDB file bytes for job documents (metadata lives in the cloud
  // `documents` table; bytes stay local so the app works offline).
  function docsStore() {
    let pdb = null;
    function open() {
      return new Promise((resolve, reject) => {
        if (pdb) return resolve(pdb);
        const req = indexedDB.open('hq_docs', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('docs', { keyPath: 'id' });
        req.onsuccess = () => { pdb = req.result; resolve(pdb); };
        req.onerror = () => reject(req.error);
      });
    }
    function tx(mode) {
      return open().then((d) => d.transaction('docs', mode).objectStore('docs'));
    }
    return {
      async put(id, blob) {
        const s = await tx('readwrite');
        return new Promise((resolve, reject) => {
          const r = s.put({ id, blob });
          r.onsuccess = () => resolve();
          r.onerror = () => reject(r.error);
        });
      },
      async get(id) {
        const s = await tx('readonly');
        return new Promise((resolve, reject) => {
          const r = s.get(id);
          r.onsuccess = () => resolve(r.result ? r.result.blob : null);
          r.onerror = () => reject(r.error);
        });
      },
      async remove(id) {
        const s = await tx('readwrite');
        return new Promise((resolve, reject) => {
          const r = s.delete(id);
          r.onsuccess = () => resolve();
          r.onerror = () => reject(r.error);
        });
      },
    };
  }

  async function boot() {
    await loadSettings();
    const co = S.settings.company_name;
    if (co) $('#brand-company').textContent = co;
    if (S.user && S.user.email) $('#user-email').textContent = S.user.email;
    go('dashboard');
  }

  function renderLogin() {
    $('#view-title').textContent = 'Sign in';
    $('#view').innerHTML = `<div class="panel login-panel">
      <h2>High Ground HQ</h2>
      <p class="muted">Sign in to access the shared workspace.</p>
      <label>Email<input id="login-email" type="email" autocomplete="username"></label>
      <label>Password<input id="login-pass" type="password" autocomplete="current-password"></label>
      <p class="form-err" id="login-err"></p>
      <div class="row">
        <button id="login-in" class="btn primary">Sign in</button>
        <button id="login-up" class="btn">Create account</button>
      </div>
      <p class="muted small">First time here? Create your account, then sign in.</p>
    </div>`;
    const err = (m) => { const e = $('#login-err'); if (e) e.textContent = m; };
    $('#login-in').onclick = async () => {
      const { error } = await db.signIn($('#login-email').value.trim(), $('#login-pass').value);
      if (error) return err(error.message);
      boot();
    };
    $('#login-up').onclick = async () => {
      const { error } = await db.signUp($('#login-email').value.trim(), $('#login-pass').value);
      if (error) return err(error.message);
      err('Account created — you can sign in now.');
    };
    $('#login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#login-in').click(); });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    $$('#nav button').forEach((b) => b.addEventListener('click', () => go(b.dataset.view)));
    const brandHome = () => go('dashboard');
    $('#brand-home').addEventListener('click', brandHome);
    $('#brand-home').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); brandHome(); } });
    $('#btn-signout').onclick = () => window.HQ.auth.signOut();
    $('#global-search').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const term = e.target.value.trim();
      if (!term) return;
      // hand the term to the leads view's own search and go there
      window.VIEWS.leads._q = term;
      e.target.value = '';
      e.target.blur();
      go('leads');
    });
    try {
      const session = await db.session();
      if (!session) return renderLogin();
      S.user = session.user;
      await boot();
    } catch (err) {
      $('#view').innerHTML = `<div class="panel"><h2>Not connected</h2><p class="muted">${h(err.message)}</p><p class="muted">The cloud config (renderer/config.js) is missing or unreachable.</p></div>`;
      console.error(err);
    }
  });
})();
</script>
<script>// High Ground HQ — views: Dashboard, Leads, Jobs.
(function () {
  'use strict';
  const { $, $$, h, money, fmtDate, badge, db, S, go } = window.HQ;

  // ---------------- Dashboard ----------------
  window.VIEWS.dashboard = {
    async render(el) {
      const leadCount = await db.count('leads', { status: { op: 'in', val: ['lead', 'contacted'] } });
      const jobCount = await db.count('jobs', { status: { op: 'nin', val: ['completed', 'cancelled'] } });
      const draftCount = await db.count('drafts', { status: 'draft' });
      const estCount = await db.count('estimates');
      const jobs = await db.list('jobs', {
        select: '*, leads(name)',
        where: { status: { op: 'nin', val: ['completed', 'cancelled'] } },
        orderBy: 'created_at', order: 'desc', limit: 8,
      });
      jobs.forEach((j) => { j.lead_name = j.leads ? j.leads.name : null; });
      const drafts = await db.list('drafts', {
        select: '*, leads(name)', where: { status: 'draft' },
        orderBy: 'created_at', order: 'desc', limit: 8,
      });
      drafts.forEach((d) => { d.lead_name = d.leads ? d.leads.name : null; });
      el.innerHTML = `
        <div class="cards">
          <div class="card"><div class="k">Active leads</div><div class="v">${leadCount}</div></div>
          <div class="card"><div class="k">Open jobs</div><div class="v">${jobCount}</div></div>
          <div class="card"><div class="k">Drafts awaiting approval</div><div class="v amber">${draftCount}</div></div>
          <div class="card"><div class="k">Supplements built</div><div class="v">${estCount}</div></div>
        </div>
        <div class="two-col">
          <div class="panel"><h2>Open jobs</h2>
            ${jobs.length ? `<table><tr><th>Address</th><th>Lead</th><th>Status</th></tr>
              ${jobs.map((j) => `<tr><td><a href="#" data-go="jobs:${j.id}">${h(j.address)}</a></td><td>${h(j.lead_name || '—')}</td><td>${badge(j.status)}</td></tr>`).join('')}</table>`
              : '<p class="muted">No open jobs.</p>'}
          </div>
          <div class="panel"><h2>Drafts awaiting approval</h2>
            ${drafts.length ? `<table><tr><th>Kind</th><th>To</th><th>Subject</th></tr>
              ${drafts.map((d) => `<tr><td>${badge(d.kind)}</td><td>${h(d.lead_name || '—')}</td><td><a href="#" data-go="comms">${h(d.subject || d.body.slice(0, 40) + '…')}</a></td></tr>`).join('')}</table>`
              : '<p class="muted">Queue is clear. Nothing waiting on your tap.</p>'}
          </div>
        </div>`;
      $$('[data-go]', el).forEach((a) => a.addEventListener('click', (e) => {
        e.preventDefault();
        const [v, arg] = a.dataset.go.split(':');
        go(v, arg ? +arg : null);
      }));
    },
  };

  // ---------------- Leads ----------------
  const LEAD_STATUSES = ['lead', 'contacted', 'estimate_sent', 'customer', 'lost'];

  window.VIEWS.leads = {
    actions() {
      return `<button class="ghost small" id="btn-import">Import CSV</button>
              <button class="ghost small" id="btn-digest">Import digest</button>
              <button class="small" id="btn-add-lead">+ Add lead</button>
              <input type="file" id="csv-file" accept=".csv" style="display:none">
              <input type="file" id="digest-file" accept=".jsonl,application/json" style="display:none">`;
    },
    bindActions(bar) {
      $('#btn-add-lead', bar).onclick = () => go('leads', 'new');
      $('#btn-import', bar).onclick = () => $('#csv-file', bar).click();
      $('#btn-digest', bar).onclick = () => $('#digest-file', bar).click();
      $('#digest-file', bar).onchange = async (e) => {
        const f = e.target.files[0];
        e.target.value = '';
        if (!f) return;
        const text = await f.text();
        let n = 0, skipped = 0;
        for (const line of text.split(/\r?\n/)) {
          const s = line.trim();
          if (!s) continue;
          let o;
          try { o = JSON.parse(s); } catch (err) { skipped++; continue; }
          if (!o.name || !String(o.name).trim()) { skipped++; continue; }
          await db.insert('leads', {
            name: String(o.name).trim(),
            phone: o.phone || '', email: o.email || '',
            address: o.address || '', city: o.city || 'Oklahoma City', zip: o.zip || '',
            source: 'digest', source_url: o.source_url || '', source_detail: o.note || '',
            notes: (o.note ? o.note + ' ' : '') + '[from morning digest]',
          });
          n++;
        }
        alert('Imported ' + n + ' digest leads.' + (skipped ? ' Skipped ' + skipped + ' lines.' : ''));
        go('leads');
      };
      $('#csv-file', bar).onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const text = await f.text();
        const lines = text.trim().split(/\r?\n/);
        const head = lines[0].split(',').map((s) => s.trim().toLowerCase());
        let n = 0;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map((s) => s.trim());
          const get = (k) => cols[head.indexOf(k)] || '';
          const name = get('name');
          if (!name) continue;
          await db.insert('leads', {
            name, phone: get('phone'), email: get('email'), address: get('address'),
            city: get('city') || 'Oklahoma City', zip: get('zip'),
            source: 'csv_import', notes: 'Imported ' + fmtDate(new Date()),
          });
          n++;
        }
        alert('Imported ' + n + ' leads.');
        go('leads');
      };
    },
    async render(el, arg) {
      if (arg === 'new' || (arg && arg !== 'list')) return this.form(el, arg === 'new' ? null : +arg);
      const q = (this._q || '').toLowerCase();
      const st = this._st || '';
      const where = {};
      if (st) where.status = st;
      const leads = q
        ? await db.search('leads', { cols: ['name', 'address', 'phone'], term: q, where, orderBy: 'created_at', order: 'desc' })
        : await db.list('leads', { where, orderBy: 'created_at', order: 'desc' });
      el.innerHTML = `
        <div class="toolbar">
          <input id="lead-q" placeholder="Search name, address, phone…" value="${h(this._q || '')}">
          <select id="lead-st" style="width:auto">
            <option value="">All statuses</option>
            ${LEAD_STATUSES.map((s) => `<option ${st === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="panel"><table>
          <tr><th>Name</th><th>Phone</th><th>Address</th><th>Source</th><th>Status</th><th>Skip trace</th><th></th></tr>
          ${leads.map((l) => `<tr>
            <td><a href="#" data-lead="${l.id}">${h(l.name)}</a></td>
            <td>${h(l.phone || '—')}</td><td>${h(l.address || '—')}</td>
            <td class="muted">${h(l.source)}</td><td>${badge(l.status)}</td>
            <td class="muted">${h(l.skip_trace_status)}</td>
            <td><div class="row-actions">
              <button class="ghost small" data-draft="${l.id}">Draft</button>
              <button class="ghost small" data-job="${l.id}">+ Job</button>
            </div></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No leads yet.</td></tr>'}
        </table></div>
        <div class="note">Skip tracing isn\u2019t connected yet — that\u2019s a paid integration the business owner adds later. The column, statuses, and provider slot in Settings are already wired for it.</div>`;
      $('#lead-q', el).oninput = (e) => { this._q = e.target.value; };
      $('#lead-q', el).onchange = () => this.render(el);
      $('#lead-st', el).onchange = (e) => { this._st = e.target.value; this.render(el); };
      $$('[data-lead]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('leads', +a.dataset.lead); });
      $$('[data-draft]', el).forEach((b) => b.onclick = () => go('comms', { newFor: +b.dataset.draft }));
      $$('[data-job]', el).forEach((b) => b.onclick = () => go('jobs', { newFor: +b.dataset.job }));
    },
    async form(el, id) {
      const l = id ? await db.get('leads', id) : null;
      const jobs = id ? await db.list('jobs', { where: { lead_id: id }, orderBy: 'created_at', order: 'desc' }) : [];
      const drafts = id ? await db.list('drafts', { where: { lead_id: id }, orderBy: 'created_at', order: 'desc' }) : [];
      el.innerHTML = `
        <div class="toolbar"><button class="ghost small" id="back">← All leads</button></div>
        <div class="two-col">
        <div class="panel"><h2>${l ? h(l.name) : 'New lead'}</h2>
          <div class="form-grid">
            <div><label>Name</label><input id="f-name" value="${h(l?.name || '')}"></div>
            <div><label>Phone</label><input id="f-phone" value="${h(l?.phone || '')}"></div>
            <div><label>Email</label><input id="f-email" value="${h(l?.email || '')}"></div>
            <div><label>Status</label><select id="f-status">${LEAD_STATUSES.map((s) => `<option ${l?.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div><label>Address</label><input id="f-address" value="${h(l?.address || '')}"></div>
            <div><label>City</label><input id="f-city" value="${h(l?.city || 'Oklahoma City')}"></div>
            <div><label>ZIP</label><input id="f-zip" value="${h(l?.zip || '')}"></div>
            <div><label>Source</label><input id="f-source" value="${h(l?.source || 'manual')}"></div>
          </div>
          <label>Notes</label><textarea id="f-notes" style="min-height:70px">${h(l?.notes || '')}</textarea>
          <div class="mt row-actions">
            <button id="save">${l ? 'Save' : 'Create lead'}</button>
            ${l ? `<button class="ghost" id="skiptrace">Run skip trace</button>` : ''}
          </div>
          ${l ? `<div class="note" id="st-note" style="display:none">Skip trace isn\u2019t connected yet — provider gets added when the business owner takes over. This button will pull name → phone/email/address then.</div>` : ''}
        </div>
        <div>
          ${l ? `<div class="panel"><h2>Jobs</h2>
            ${jobs.map((j) => `<p><a href="#" data-gojob="${j.id}">${h(j.address)}</a> ${badge(j.status)}</p>`).join('') || '<p class="muted">No jobs yet.</p>'}
            <button class="ghost small mt" id="add-job">+ Job for this lead</button></div>
          <div class="panel"><h2>Drafts</h2>
            ${drafts.map((d) => `<p>${badge(d.kind)} ${badge(d.status)} <span class="muted">${h(d.subject || d.body.slice(0, 50))}</span></p>`).join('') || '<p class="muted">No drafts yet.</p>'}
            <button class="ghost small mt" id="add-draft">+ Draft for this lead</button></div>` : ''}
        </div></div>`;
      $('#back', el).onclick = () => go('leads');
      $('#save', el).onclick = async () => {
        const vals = ['f-name', 'f-phone', 'f-email', 'f-status', 'f-address', 'f-city', 'f-zip', 'f-source', 'f-notes'].map((i) => $('#' + i, el).value.trim());
        if (!vals[0]) { alert('Name is required.'); return; }
        const obj = { name: vals[0], phone: vals[1], email: vals[2], status: vals[3], address: vals[4], city: vals[5], zip: vals[6], source: vals[7], notes: vals[8] };
        if (l) await db.update('leads', id, obj);
        else { await db.insert('leads', obj); }
        go('leads');
      };
      const st = $('#skiptrace', el);
      if (st) st.onclick = () => { $('#st-note', el).style.display = 'block'; };
      const aj = $('#add-job', el); if (aj) aj.onclick = () => go('jobs', { newFor: id });
      const ad = $('#add-draft', el); if (ad) ad.onclick = () => go('comms', { newFor: id });
      $$('[data-gojob]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('jobs', +a.dataset.gojob); });
    },
  };

  // ---------------- Jobs ----------------
  const JOB_STATUSES = ['estimate', 'supplement', 'approved', 'scheduled', 'in_progress', 'completed', 'cancelled'];
  const PIPELINE = ['estimate', 'supplement', 'approved', 'scheduled', 'in_progress', 'completed', 'paid'];
  const DOC_KINDS = ['photo', 'eagleview', 'contract', 'invoice', 'other'];

  window.VIEWS.jobs = {
    actions() { return `<button class="small" id="btn-add-job">+ Add job</button>`; },
    bindActions(bar) { $('#btn-add-job', bar).onclick = () => go('jobs', 'new'); },
    async render(el, arg) {
      if (arg === 'new' || (arg && typeof arg === 'object') || (arg && arg !== 'list')) return this.form(el, arg);
      const jobs = await db.list('jobs', { select: '*, leads(name)', orderBy: 'created_at', order: 'desc' });
      jobs.forEach((j) => { j.lead_name = j.leads ? j.leads.name : null; });
      el.innerHTML = `<div class="panel"><table>
        <tr><th>Address</th><th>Lead</th><th>Status</th><th>Claim</th><th>Carrier</th><th></th></tr>
        ${jobs.map((j) => `<tr>
          <td><a href="#" data-job="${j.id}">${h(j.address)}</a></td>
          <td>${h(j.lead_name || '—')}</td><td>${badge(j.status)}</td>
          <td class="muted">${h(j.claim_number || '—')}</td><td class="muted">${h(j.carrier || '—')}</td>
          <td><button class="ghost small" data-est="${j.id}">Supplement</button></td></tr>`).join('')}
        </table></div>`;
      $$('[data-job]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('jobs', +a.dataset.job); });
      $$('[data-est]', el).forEach((b) => b.onclick = () => go('estimates', { newFor: +b.dataset.est }));
    },

    // New-job form (kept slim); existing jobs open the hub below.
    async newForm(el, presetLead) {
      const leads = await db.list('leads', { select: 'id, name', orderBy: 'name' });
      el.innerHTML = `
        <div class="toolbar"><button class="ghost small" id="back">← All jobs</button></div>
        <div class="panel"><h2>New job</h2>
          <label>Lead</label><select id="f-lead"><option value="">— none —</option>
            ${leads.map((l) => `<option value="${l.id}" ${presetLead === l.id ? 'selected' : ''}>${h(l.name)}</option>`).join('')}</select>
          <label>Job address</label><input id="f-address">
          <div class="form-grid">
            <div><label>Status</label><select id="f-status">${JOB_STATUSES.map((s) => `<option>${s}</option>`).join('')}</select></div>
            <div><label>Claim #</label><input id="f-claim"></div>
            <div><label>Carrier</label><input id="f-carrier"></div>
            <div><label>Adjuster</label><input id="f-adjuster"></div>
            <div><label>Date of loss</label><input id="f-dol" placeholder="2026-05-18"></div>
          </div>
          <label>Notes</label><textarea id="f-notes" style="min-height:60px"></textarea>
          <div class="mt"><button id="save">Create job</button></div>
        </div>`;
      $('#back', el).onclick = () => go('jobs');
      $('#save', el).onclick = async () => {
        const address = $('#f-address', el).value.trim();
        if (!address) { alert('Address is required.'); return; }
        const row = await db.insert('jobs', {
          lead_id: $('#f-lead', el).value || null, address,
          status: $('#f-status', el).value, claim_number: $('#f-claim', el).value.trim(),
          carrier: $('#f-carrier', el).value.trim(), adjuster: $('#f-adjuster', el).value.trim(),
          date_of_loss: $('#f-dol', el).value.trim(), notes: $('#f-notes', el).value.trim(),
        });
        go('jobs', row.id);
      };
    },

    async form(el, arg) {
      const isNew = arg === 'new' || (arg && typeof arg === 'object');
      if (isNew) return this.newForm(el, arg && typeof arg === 'object' ? arg.newFor : null);
      return this.hub(el, +arg);
    },

    // Job hub: pipeline + claim info + measurements + estimates + docs + comms + financials.
    async hub(el, id) {
      const j = await db.get('jobs', id);
      if (!j) { el.innerHTML = '<p class="muted">Job not found.</p>'; return; }
      const leads = await db.list('leads', { select: 'id, name', orderBy: 'name' });
      const lead = j.lead_id ? await db.get('leads', j.lead_id) : null;
      const estimates = await db.list('estimates', { where: { job_id: id }, orderBy: 'created_at', order: 'desc' });
      const drafts = await db.list('drafts', { where: { job_id: id }, orderBy: 'created_at', order: 'desc' });
      const docs = await db.list('documents', { where: { job_id: id }, orderBy: 'created_at', order: 'desc' });
      const m = JSON.parse(j.measurements_json || '{}');
      const fin = Object.assign({ materials_cost: 0, labor_cost: 0, other_cost: 0, paid_amount: 0 }, JSON.parse(j.financials_json || '{}'));
      const billed = estimates.length ? (+(JSON.parse(estimates[0].totals_json || '{}').total || 0)) : 0;
      const totalCost = (+fin.materials_cost || 0) + (+fin.labor_cost || 0) + (+fin.other_cost || 0);
      const balance = billed - (+fin.paid_amount || 0);
      const curIdx = PIPELINE.indexOf(j.status);

      const stageBtn = (s, i) => {
        const cls = i < curIdx ? 'done' : i === curIdx ? '' : 'ghost';
        return `<button class="${cls} small" data-stage="${s}" ${i === curIdx ? 'disabled' : ''}>${s.replace('_', ' ')}</button>`;
      };

      el.innerHTML = `
        <div class="toolbar"><button class="ghost small" id="back">← All jobs</button></div>
        <div class="panel"><h2>${h(j.address)}</h2>
          <p class="muted">${lead ? `Lead: <a href="#" id="hub-lead">${h(lead.name)}</a> · ` : ''}Claim ${h(j.claim_number || '—')} · ${h(j.carrier || '')}</p>
          <div class="pipeline">${PIPELINE.map(stageBtn).join('<span class="pipe-arrow">→</span>')}</div>
        </div>
        <div class="two-col">
          <div>
            <div class="panel"><h2>Claim info</h2>
              <label>Lead</label><select id="f-lead"><option value="">— none —</option>
                ${leads.map((l) => `<option value="${l.id}" ${j.lead_id === l.id ? 'selected' : ''}>${h(l.name)}</option>`).join('')}</select>
              <label>Job address</label><input id="f-address" value="${h(j.address || '')}">
              <div class="form-grid">
                <div><label>Status</label><select id="f-status">${JOB_STATUSES.concat(j.status === 'paid' ? ['paid'] : []).map((s) => `<option ${j.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                <div><label>Claim #</label><input id="f-claim" value="${h(j.claim_number || '')}"></div>
                <div><label>Carrier</label><input id="f-carrier" value="${h(j.carrier || '')}"></div>
                <div><label>Adjuster</label><input id="f-adjuster" value="${h(j.adjuster || '')}"></div>
                <div><label>Date of loss</label><input id="f-dol" value="${h(j.date_of_loss || '')}"></div>
              </div>
              <label>EagleView / measurements note</label><textarea id="f-ev" style="min-height:60px">${h(j.eagleview_note || '')}</textarea>
              <label>Notes</label><textarea id="f-notes" style="min-height:60px">${h(j.notes || '')}</textarea>
              <div class="mt"><button id="save">Save claim info</button></div>
            </div>
            <div class="panel"><h2>Financials</h2>
              <div class="form-grid">
                <div><label>Materials cost</label><input id="fin-mat" type="number" step="any" value="${fin.materials_cost || ''}"></div>
                <div><label>Labor cost</label><input id="fin-lab" type="number" step="any" value="${fin.labor_cost || ''}"></div>
                <div><label>Other cost</label><input id="fin-oth" type="number" step="any" value="${fin.other_cost || ''}"></div>
                <div><label>Paid amount</label><input id="fin-paid" type="number" step="any" value="${fin.paid_amount || ''}"></div>
              </div>
              <table class="mt"><tr><td>Total cost</td><td><b>${money(totalCost)}</b></td></tr>
              <tr><td>Billed (latest supplement)</td><td><b>${money(billed)}</b></td></tr>
              <tr><td>Paid</td><td><b>${money(fin.paid_amount)}</b></td></tr>
              <tr class="total-row"><td>Balance</td><td>${money(balance)}</td></tr></table>
              <div class="mt"><button id="fin-save">Save financials</button></div>
            </div>
          </div>
          <div>
            <div class="panel"><h2>Measurements</h2>
              ${m.roofSQ ? `<table>
                <tr><td>Total area</td><td><b>${h(m.totalSqFt)} sq ft</b></td></tr>
                <tr><td>Roof squares (w/ ${h(m.wastePct)}% waste)</td><td><b>${h(m.roofSQ)} SQ</b></td></tr>
                <tr><td>Pitch</td><td>${h(m.pitch || '—')}</td></tr>
                <tr><td>Eaves / Rakes</td><td>${h(m.eavesLF)} / ${h(m.rakesLF)} LF</td></tr>
                <tr><td>Ridges / Hips / Valleys</td><td>${h(m.ridgesLF)} / ${h(m.hipsLF)} / ${h(m.valleysLF)} LF</td></tr>
                <tr><td>Starter / Drip edge / Ridge cap</td><td>${h(m.starterLF)} / ${h(m.dripEdgeLF)} / ${h(m.ridgeCapLF)} LF</td></tr>
              </table>` : '<p class="muted">No measurements yet — parse an EagleView report or enter them in the estimate builder.</p>'}
            </div>
            <div class="panel"><h2>Supplements</h2>
              ${estimates.map((e) => { const t = JSON.parse(e.totals_json || '{}'); let sc = {}; try { sc = JSON.parse(e.scope_json || '{}'); } catch (err) {}
                const chips = Object.keys(sc).filter((k) => sc[k]).map((k) => `<span class="badge b-draft">${h(k)}</span>`).join(' ');
                return `<p><a href="#" data-est="${e.id}">Supplement ${fmtDate(e.created_at)}</a> — <b>${money(t.total)}</b> ${chips}</p>`; }).join('') || '<p class="muted">None yet.</p>'}
              <button class="small mt" id="new-est">+ Build supplement</button>
            </div>
            <div class="panel"><h2>Documents (${docs.length})</h2>
              <div id="doc-list">
              ${docs.map((d) => `<div class="doc-row">
                <div><b>${h(d.filename || 'Untitled')}</b> ${badge(d.kind || 'other')}
                  <div class="muted small">${h(d.note || '')} ${fmtDate(d.created_at)}</div></div>
                <div class="row-actions">
                  <button class="ghost small" data-dl="${d.id}">Open</button>
                  <button class="danger small" data-deldoc="${d.id}">Delete</button>
                </div></div>`).join('') || '<p class="muted">No documents yet.</p>'}
              </div>
              <h3>Add document</h3>
              <div class="form-grid">
                <div><label>Name</label><input id="doc-name" placeholder="e.g. EagleView report"></div>
                <div><label>Kind</label><select id="doc-kind">${DOC_KINDS.map((k) => `<option>${k}</option>`).join('')}</select></div>
              </div>
              <label>Note</label><input id="doc-note" placeholder="optional">
              <label>File (optional — stored on this device)</label><input type="file" id="doc-file">
              <label>Photo — phone camera</label><input type="file" id="doc-file-cam" accept="image/*" capture="environment">
              <div class="mt"><button class="small" id="doc-add">Add document</button></div>
            </div>
            <div class="panel"><h2>Comms</h2>
              ${drafts.map((d) => `<p>${badge(d.kind)} ${badge(d.status)} <a href="#" data-draft="${d.id}">${h(d.subject || (d.body || '').slice(0, 50))}</a></p>`).join('') || '<p class="muted">No drafts for this job.</p>'}
              <button class="ghost small mt" id="new-draft">+ New draft</button>
            </div>
          </div>
        </div>`;

      $('#back', el).onclick = () => go('jobs');
      const hl = $('#hub-lead', el); if (hl) hl.onclick = (e) => { e.preventDefault(); go('leads', j.lead_id); };
      $$('[data-stage]', el).forEach((b) => b.onclick = async () => {
        await db.update('jobs', id, { status: b.dataset.stage });
        go('jobs', id);
      });
      $('#save', el).onclick = async () => {
        const vals = {
          lead_id: $('#f-lead', el).value || null, address: $('#f-address', el).value.trim(),
          status: $('#f-status', el).value, claim_number: $('#f-claim', el).value.trim(),
          carrier: $('#f-carrier', el).value.trim(), adjuster: $('#f-adjuster', el).value.trim(),
          date_of_loss: $('#f-dol', el).value.trim(), eagleview_note: $('#f-ev', el).value.trim(),
          notes: $('#f-notes', el).value.trim(),
        };
        if (!vals.address) { alert('Address is required.'); return; }
        await db.update('jobs', id, vals);
        alert('Saved.');
        go('jobs', id);
      };
      $('#fin-save', el).onclick = async () => {
        const g = (i) => parseFloat($('#' + i, el).value) || 0;
        await db.update('jobs', id, { financials_json: JSON.stringify({
          materials_cost: g('fin-mat'), labor_cost: g('fin-lab'), other_cost: g('fin-oth'), paid_amount: g('fin-paid'),
        }) });
        alert('Financials saved.');
        go('jobs', id);
      };
      const ne = $('#new-est', el); if (ne) ne.onclick = () => go('estimates', { newFor: id });
      const nd = $('#new-draft', el); if (nd) nd.onclick = () => go('comms', { newForJob: id });
      $$('[data-est]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('estimates', +a.dataset.est); });
      $$('[data-draft]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('comms', +a.dataset.draft); });

      // documents
      const refreshDocs = () => go('jobs', id);
      $('#doc-add', el).onclick = async () => {
        const file = $('#doc-file', el).files[0] || ($('#doc-file-cam', el) && $('#doc-file-cam', el).files[0]);
        const filename = $('#doc-name', el).value.trim() || (file ? file.name : '');
        if (!filename) { alert('Give the document a name or pick a file.'); return; }
        const row = await db.insert('documents', {
          job_id: id, lead_id: j.lead_id || null,
          kind: $('#doc-kind', el).value, filename,
          note: $('#doc-note', el).value.trim(),
          mime: file ? file.type : '', storage_path: '',
        });
        if (file) {
          try { await window.HQ.docs.put(row.id, file); }
          catch (err) { alert('Saved the record, but the file could not be stored on this device: ' + err.message); }
        }
        refreshDocs();
      };
      $$('[data-dl]', el).forEach((b) => b.onclick = async () => {
        try {
          const blob = await window.HQ.docs.get(+b.dataset.dl);
          if (!blob) { alert('No file stored for this document on this device.'); return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.target = '_blank';
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        } catch (err) { alert('Could not open file: ' + err.message); }
      });
      $$('[data-deldoc]', el).forEach((b) => b.onclick = async () => {
        if (!confirm('Delete this document record?')) return;
        await db.remove('documents', +b.dataset.deldoc);
        try { await window.HQ.docs.remove(+b.dataset.deldoc); } catch (err) { /* no bytes stored */ }
        refreshDocs();
      });
    },
  };
})();
</script>
