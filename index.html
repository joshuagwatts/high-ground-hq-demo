ns+'</div>':'')+'<table class=\"report-table\"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table><div class=\"report-total\"><div class=\"total-row\"><span>Subtotal</span><b>'+money(t.subtotal)+'</b></div>'+(t.oh?'<div class=\"total-row\"><span>Overhead (10%)</span><b>'+money(t.oh)+'</b></div><div class=\"total-row\"><span>Profit (10%)</span><b>'+money(t.profit)+'</b></div>':'')+'<div class=\"total-row grand\"><span>Grand total</span><span>'+money(t.grand)+'</span></div></div><div class=\"notes-report\"><h3>Notes / justification</h3><ol>'+notes+'</ol><p><b>Contractor note:</b> Quantities and requirements must be field-verified. Attach photos, code references, invoices, moisture records, environmental reports, and product documentation as applicable.</p></div><div class=\"signature\"><div class=\"sig-line\">Prepared by</div><div class=\"sig-line\">Date</div><div class=\"sig-line\">Signature</div></div>'\n  }\n  function renderReport(){byId('reportSheet').innerHTML=reportMarkup()}\n  function downloadBlob(name,type,text){var a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}\n  function summaryText(){var d=reportData(),c=d.claim,t=d.totals;var out=['HIGH GROUND ROOFING & CONSTRUCTION','FULL SCOPE ESTIMATE'];if(c.policyholder)out.push('Policyholder: '+c.policyholder);if(c.address)out.push('Property: '+c.address);if(c.carrier)out.push('Carrier: '+c.carrier);if(c.claimNo)out.push('Claim: '+c.claimNo);out.push('', 'CONSTRUCTION-SEQUENCED SCOPE');var stage='';t.lines.forEach(function(l){if(l.stage!==stage){stage=l.stage;out.push('',stage.toUpperCase())}out.push('- '+l.name+': '+fmtQty(l.qty)+' '+l.unit+' \u00d7 '+money(l.price)+' = '+money(l.total))});out.push('','Subtotal: '+money(t.subtotal));if(t.oh){out.push('Overhead: '+money(t.oh),'Profit: '+money(t.profit))}out.push('Grand total: '+money(t.grand),'','High Ground Roofing & Construction \u00b7 (405) 252-0058 \u00b7 Josh@highgroundokc.com');return out.join('\\n')}\n  byId('copySummary').addEventListener('click',function(){var text=summaryText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Summary copied.')}).catch(function(){fallbackCopy(text)})}else fallbackCopy(text)});\n  function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Summary copied.')}\n  byId('exportCsv').addEventListener('click',function(){var d=reportData(),rows=[['Construction phase','Item','Qty','Unit','Unit price','Total']].concat(d.totals.lines.map(function(l){return [l.stage||'',l.name,l.qty,l.unit,l.price,l.total]}));var csv=rows.map(function(r){return r.map(function(v){return '\"'+String(v).replace(/\"/g,'\"\"')+'\"'}).join(',')}).join('\\r\\n');downloadBlob('full-scope-estimate.csv','text/csv;charset=utf-8',csv)});\n  byId('downloadReport').addEventListener('click',function(){var html='<!doctype html><html><head><meta charset=\"utf-8\"><title>Full Scope Estimate</title><style>body{font-family:Arial,sans-serif;color:#172126;margin:.45in}.letterhead{display:flex;justify-content:space-between;border-bottom:3px solid #db5f27;padding-bottom:14px}.letterhead h1{font-size:29px;margin:0}.letterhead div:last-child{text-align:right;font-size:12px}.report-title{font-size:30px;font-weight:700;margin:22px 0 12px}.report-meta,.report-measures{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 18px;font-size:12px;margin-bottom:17px}.report-meta b,.report-measures b{display:block;color:#526169}.report-table{width:100%;border-collapse:collapse;font-size:11px}.report-table th{background:#27343a;color:#fff;text-align:left}.report-table th,.report-table td{padding:7px;border:1px solid #cbd3d7}.report-table td:nth-child(n+2),.report-table th:nth-child(n+2){text-align:right}.report-table .phase-row td{text-align:left;background:#edf1f2;color:#27343a;font-weight:700}.report-total{margin:13px 0 0 auto;width:280px}.total-row{display:flex;justify-content:space-between;padding:5px}.grand{border-top:2px solid #172126;font-size:20px;font-weight:700}.notes-report{font-size:11px}.signature{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:36px}.sig-line{border-top:1px solid #172126;padding-top:5px;font-size:11px}@media print{@page{size:letter;margin:.35in}body{margin:0}.report-table tr{page-break-inside:avoid}}</style></head><body>'+reportMarkup()+'</body></html>';downloadBlob('full-scope-estimate.html','text/html;charset=utf-8',html);toast('Printable report downloaded. Open it and choose Print / Save PDF.')});\n  byId('downloadPrices').addEventListener('click',function(){downloadBlob('high-ground-roof-prices.json','application/json',JSON.stringify({version:1,prices:prices},null,2))});\n  byId('loadPrices').addEventListener('change',function(){var f=this.files[0];if(!f)return;f.text().then(function(text){var data=JSON.parse(text),src=data.prices||data;Object.keys(defaults).forEach(function(k){if(src[k]!=null&&isFinite(Number(src[k])))prices[k]=Number(src[k])});renderPriceGrid();renderReview();toast('Price list loaded.')}).catch(function(){toast('That price list could not be read.')});this.value=''});\n  byId('resetPrices').addEventListener('click',function(){prices=Object.assign({},defaults);renderPriceGrid();renderReview();toast('Default prices restored.')});\n  updateMapsLink();updateDeckGuide();updateSiteGuide();updateCodeCoverage();updateWoodGuide();updateInteriorQuestions();updateScopeSections();updateSlopeGuide();updateExteriorPlan();updateLeadIndicator();updateTraceStats();renderReview();updateDerived();updateFoundCount();\n})();\n<\/script>\n</body>\n</html>\n";
</script>
<script>// High Ground HQ — views: Estimates (supplement builder), Comms, Campaigns, Settings.
(function () {
  'use strict';
  const { $, $$, h, money, fmtDate, badge, db, S, go, TEMPLATES, fillTemplate, aiPromptForDraft } = window.HQ;
  const SE = window.HQSupplement;
  const PA = window.HQParsers;

  // ---------------- Estimates ----------------
  const EST = { step: 1, jobId: null, claim: {}, raw: {}, adjusterText: '', adjusterItems: [], includeCovered: false, overrides: {}, result: null, scopes: { roof: true }, audit: [] };

  async function extractPdfText(file) {
    const pdfjs = await import('../node_modules/pdfjs-dist/build/pdf.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = '../node_modules/pdfjs-dist/build/pdf.worker.mjs';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjs.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      text += tc.items.map((it) => it.str).join(' ') + '\n';
    }
    return text;
  }

  window.VIEWS.estimates = {
    // The real Supplement Builder, plugged in (exported artifact, embedded
    // via srcdoc so it runs isolated but offline-capable). It keeps its own
    // job library; nothing here phones home.
    async render(el) {
      el.innerHTML = `
        <iframe class="embed-frame" title="Supplement Builder"
          sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>`;
      const f = el.querySelector('iframe');
      if (window.HQ_ESTMAKER_HTML) f.srcdoc = window.HQ_ESTMAKER_HTML;
      else f.srcdoc = '<p style="font-family:sans-serif;padding:24px">Estimate maker failed to load — the app bundle is missing its data file.</p>';
    },
  };

  // ---------------- Comms ----------------
  window.VIEWS.comms = {
    actions() { return `<button class="small" id="btn-new-draft">+ New draft</button>`; },
    bindActions(bar) { $('#btn-new-draft', bar).onclick = () => go('comms', { new: true }); },
    async render(el, arg) {
      if (arg && (arg.new || arg.newFor)) return this.composer(el, arg.newFor || null, null, null);
      if (arg && arg.newForJob) return this.composer(el, null, null, arg.newForJob);
      if (arg && typeof arg === 'number') return this.composer(el, null, arg, null);
      const kf = this._kf || '', sf = this._sf || '';
      const where = {};
      if (kf) where.kind = kf;
      if (sf) where.status = sf;
      const drafts = await db.list('drafts', { select: '*, leads(name)', where, orderBy: 'created_at', order: 'desc' });
      drafts.forEach((d) => { d.lead_name = d.leads ? d.leads.name : null; });
      el.innerHTML = `
        <div class="toolbar">
          <select id="c-kf" style="width:auto"><option value="">All kinds</option>
            ${['email', 'text', 'call'].map((k) => `<option ${kf === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
          <select id="c-sf" style="width:auto"><option value="">All statuses</option>
            ${['draft', 'approved', 'sent'].map((s) => `<option ${sf === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
        </div>
        <div class="panel"><table><tr><th></th><th>To</th><th>Subject / preview</th><th>Status</th><th></th></tr>
        ${drafts.map((d) => `<tr><td>${badge(d.kind)}</td><td>${h(d.lead_name || '—')}</td>
          <td><a href="#" data-draft="${d.id}">${h(d.subject || d.body.slice(0, 60))}</a></td>
          <td>${badge(d.status)}</td>
          <td><div class="row-actions">${d.status === 'draft' ? `<button class="small" data-approve="${d.id}">Approve</button>` : ''}</div></td></tr>`).join('')
          || '<tr><td colspan="5" class="muted">No drafts. Nothing waiting on your tap.</td></tr>'}
        </table></div>
        <div class="note">Free tier: drafts live here until you approve them. Email goes out as a Gmail draft (ask Muse in chat to file it — you send it yourself). Texts and calls light up when the owner adds Twilio. Nothing ever sends on its own.</div>`;
      $('#c-kf', el).onchange = (e) => { this._kf = e.target.value; this.render(el); };
      $('#c-sf', el).onchange = (e) => { this._sf = e.target.value; this.render(el); };
      $$('[data-draft]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('comms', +a.dataset.draft); });
      $$('[data-approve]', el).forEach((b) => b.onclick = async () => { await db.update('drafts', +b.dataset.approve, { status: 'approved' }); this.render(el); });
    },

    async composer(el, leadId, draftId, jobId) {
      const d = draftId ? await db.get('drafts', draftId) : null;
      const leads = await db.list('leads', { select: 'id, name, phone, email, address, city, zip', orderBy: 'name' });
      const jobs = await db.list('jobs', { select: 'id, address, claim_number, carrier', orderBy: 'created_at', order: 'desc', limit: 30 });
      const selLead = d?.lead_id || leadId || '';
      const selJob = d?.job_id || jobId || '';
      let preLead = selLead;
      if (!preLead && jobId) {
        const jj = await db.get('jobs', +jobId);
        if (jj && jj.lead_id) preLead = jj.lead_id;
      }
      el.innerHTML = `
        <div class="toolbar"><button class="ghost small" id="back">← All drafts</button></div>
        <div class="two-col">
        <div class="panel"><h2>${d ? 'Edit draft' : 'New draft'}</h2>
          <div class="form-grid">
            <div><label>Kind</label><select id="d-kind">
              ${['email', 'text', 'call'].map((k) => `<option ${(d?.kind || 'email') === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
            <div><label>To (lead)</label><select id="d-lead"><option value="">— none —</option>
              ${leads.map((l) => `<option value="${l.id}" ${+preLead === l.id ? 'selected' : ''}>${h(l.name)}</option>`).join('')}</select></div>
          </div>
          <label>Template</label><select id="d-tpl"><option value="">— start blank —</option>
            ${TEMPLATES.map((t) => `<option value="${t.id}">${h(t.name)}</option>`).join('')}</select>
          <div id="d-subject-wrap"><label>Subject</label><input id="d-subject" value="${h(d?.subject || '')}"></div>
          <label>Body</label><textarea id="d-body" style="min-height:220px">${h(d?.body || '')}</textarea>
          <div class="mt row-actions">
            <button class="ghost" id="d-ai">Copy AI prompt</button>
            <button class="ghost" id="d-save">Save draft</button>
            <button id="d-approve">${d && d.status !== 'draft' ? 'Save' : 'Save & approve'}</button>
            ${d ? `<button class="danger" id="d-del">Delete</button>` : ''}
          </div>
          <div class="note" id="ai-note" style="display:none">Prompt copied — paste it to Muse in chat, paste the rewrite back here. That\u2019s the free AI loop until an API key lands in Settings.</div>
        </div>
        <div class="panel"><h2>Merge fields</h2>
          <p class="muted">Templates fill these from the lead + job. <code>{{custom}}</code> is yours to type per draft.</p>
          <table><tr><th>Field</th><th>Value</th></tr>
          <tbody id="merge-rows"><tr><td colspan="2" class="muted">Pick a lead to preview.</td></tr></tbody></table>
          <h3 class="mt">Context job (for {{job_address}} etc.)</h3>
          <select id="d-job"><option value="">— none —</option>
            ${jobs.map((j) => `<option value="${j.id}" ${+selJob === j.id ? 'selected' : ''}>${h(j.address)}</option>`).join('')}</select>
        </div></div>`;
      const ctxFor = () => {
        const lid = $('#d-lead', el).value;
        const l = leads.find((x) => x.id === +lid) || {};
        const jid = $('#d-job', el).value;
        const j = jobs.find((x) => x.id === +jid) || {};
        const street = (l.address || '').replace(/^\d+\s*/, '');
        return { name: (l.name || '').split(' ')[0], address: l.address || '', street: street || l.address || '', city: l.city || 'Oklahoma City', zip: l.zip || '', job_address: j.address || '', claim_number: j.claim_number || '', carrier: j.carrier || '', custom: '' };
      };
      const refreshMerge = () => {
        const c = ctxFor();
        $('#merge-rows', el).innerHTML = Object.entries(c).map(([k, v]) => `<tr><td><code>{{${k}}}</code></td><td>${h(v) || '<span class="muted">—</span>'}</td></tr>`).join('');
      };
      $('#d-lead', el).onchange = refreshMerge;
      $('#d-job', el).onchange = refreshMerge;
      refreshMerge();
      $('#d-tpl', el).onchange = (e) => {
        const t = TEMPLATES.find((x) => x.id === e.target.value);
        if (!t) return;
        const filled = fillTemplate(t, ctxFor());
        $('#d-kind', el).value = t.kind;
        $('#d-subject', el).value = filled.subject;
        $('#d-body', el).value = filled.body;
      };
      $('#d-kind', el).onchange = (e) => { $('#d-subject-wrap', el).style.display = e.target.value === 'email' ? '' : 'none'; };
      $('#d-kind', el).dispatchEvent(new Event('change'));
      $('#back', el).onclick = () => go('comms');
      $('#d-ai', el).onclick = async () => {
        const prompt = aiPromptForDraft($('#d-kind', el).value, $('#d-subject', el).value, $('#d-body', el).value, ctxFor());
        await navigator.clipboard.writeText(prompt);
        $('#ai-note', el).style.display = 'block';
      };
      const collect = () => ({
        kind: $('#d-kind', el).value,
        lead_id: $('#d-lead', el).value || null,
        job_id: $('#d-job', el).value || null,
        subject: $('#d-subject', el).value.trim(),
        body: $('#d-body', el).value.trim(),
      });
      const save = async (status) => {
        const v = collect();
        if (!v.body) { alert('Body is required.'); return null; }
        if (d) await db.update('drafts', draftId, { kind: v.kind, lead_id: v.lead_id, job_id: v.job_id, subject: v.subject, body: v.body, status });
        else await db.insert('drafts', { kind: v.kind, lead_id: v.lead_id, job_id: v.job_id, subject: v.subject, body: v.body, status });
        return true;
      };
      $('#d-save', el).onclick = async () => { if (await save(d ? d.status : 'draft')) go('comms'); };
      $('#d-approve', el).onclick = async () => { if (await save('approved')) go('comms'); };
      const del = $('#d-del', el);
      if (del) del.onclick = async () => { if (confirm('Delete this draft?')) { await db.remove('drafts', draftId); go('comms'); } };
    },
  };

  // ---------------- Campaigns ----------------
  window.VIEWS.campaigns = {
    actions() { return `<button class="small" id="btn-new-camp">+ New campaign</button>`; },
    bindActions(bar) { $('#btn-new-camp', bar).onclick = () => go('campaigns', 'new'); },
    async render(el, arg) {
      if (arg === 'new') return this.builder(el);
      if (typeof arg === 'number') return this.detail(el, arg);
      const camps = await db.list('campaigns', { select: '*, jobs(address)', orderBy: 'created_at', order: 'desc' });
      const allTargets = await db.list('campaign_targets', { select: 'campaign_id, status' });
      for (const c of camps) {
        c.job_address = c.jobs ? c.jobs.address : null;
        const tc = allTargets.filter((t) => t.campaign_id === c.id);
        c.targets = tc.length;
        c.approved = tc.filter((t) => t.status === 'approved').length;
      }
      el.innerHTML = `<div class="panel"><table><tr><th>Campaign</th><th>Finished job</th><th>Targets</th><th>Approved</th><th>Status</th></tr>
        ${camps.map((c) => `<tr><td><a href="#" data-camp="${c.id}">${h(c.name)}</a></td><td class="muted">${h(c.job_address || '—')}</td><td>${c.targets}</td><td>${c.approved || 0}</td><td>${badge(c.status)}</td></tr>`).join('')
          || '<tr><td colspan="5" class="muted">No campaigns yet. Finish a job, then canvass its street.</td></tr>'}
        </table></div>
        <div class="note">The free loop: add neighbor addresses by hand (or paste a list), generate drafts from templates, approve them here. Skip-trace auto-enrichment and Twilio sending get wired when the owner adds the paid integrations. Every text includes the STOP opt-out line; keep a consent record before any cold texting.</div>`;
      $$('[data-camp]', el).forEach((a) => a.onclick = (e) => { e.preventDefault(); go('campaigns', +a.dataset.camp); });
    },

    async builder(el) {
      const jobs = await db.list('jobs', { select: 'id, address', where: { status: 'completed' }, orderBy: 'created_at', order: 'desc' });
      el.innerHTML = `<div class="toolbar"><button class="ghost small" id="back">← All campaigns</button></div>
        <div class="panel"><h2>New neighborhood campaign</h2>
        <label>Campaign name</label><input id="cp-name" placeholder="e.g. NW 36th St canvass — Oct 2026">
        <label>Finished job (anchors the outreach)</label><select id="cp-job"><option value="">— pick —</option>
          ${jobs.map((j) => `<option value="${j.id}">${h(j.address)}</option>`).join('')}</select>
        <label>Neighbor addresses (one per line — street, number, whatever you\u2019ve got)</label>
        <textarea id="cp-addrs" placeholder="2321 NW 36th St&#10;2325 NW 36th St&#10;…"></textarea>
        <div class="mt"><button id="cp-create">Create campaign</button></div>
        <div class="note">Names and phone numbers fill in automatically once skip tracing is connected. Until then, add what you know per target on the next screen.</div></div>`;
      $('#back', el).onclick = () => go('campaigns');
      $('#cp-create', el).onclick = async () => {
        const name = $('#cp-name', el).value.trim();
        const jobId = $('#cp-job', el).value || null;
        if (!name) { alert('Name the campaign.'); return; }
        const camp = await db.insert('campaigns', { name, job_id: jobId });
        const campId = camp.id;
        const addrs = $('#cp-addrs', el).value.split('\n').map((s) => s.trim()).filter(Boolean);
        for (const a of addrs) await db.insert('campaign_targets', { campaign_id: campId, address: a });
        go('campaigns', campId);
      };
    },

    async detail(el, id) {
      const crows = await db.list('campaigns', { select: '*, jobs(address)', where: { id } });
      const c = crows[0] || null;
      if (c) c.job_address = c.jobs ? c.jobs.address : null;
      const targets = await db.list('campaign_targets', { select: '*, drafts(kind, status, subject)', where: { campaign_id: id }, orderBy: 'id' });
      targets.forEach((t) => { t.kind = t.drafts ? t.drafts.kind : null; t.dstatus = t.drafts ? t.drafts.status : null; t.subject = t.drafts ? t.drafts.subject : null; });
      const jobCtx = { job_address: c.job_address || '' };
      el.innerHTML = `<div class="toolbar"><button class="ghost small" id="back">← All campaigns</button></div>
        <div class="panel"><h2>${h(c.name)}</h2>
        <p class="muted">Anchored on: ${h(c.job_address || '—')} · ${badge(c.status)}</p>
        <div class="row-actions"><button class="small" id="cp-gen">Generate drafts for all targets</button>
        <button class="ghost small" id="cp-flyer">Print flyer</button>
        <button class="ghost small" id="cp-add">+ Add target</button></div></div>
        <div class="panel"><table><tr><th>Address</th><th>Name</th><th>Phone</th><th>Draft</th><th>Status</th><th></th></tr>
        ${targets.map((t) => `<tr><td>${h(t.address)}</td>
          <td><input data-tname="${t.id}" value="${h(t.name)}" placeholder="—" style="width:130px"></td>
          <td><input data-tphone="${t.id}" value="${h(t.phone)}" placeholder="—" style="width:130px"></td>
          <td>${t.draft_id ? `${badge(t.kind)} ${badge(t.dstatus)} <span class="muted">${h(t.subject || '')}</span>` : '<span class="muted">none</span>'}</td>
          <td>${badge(t.status)}</td>
          <td><div class="row-actions">
            ${t.draft_id && t.dstatus === 'draft' ? `<button class="small" data-tapprove="${t.draft_id}" data-tid="${t.id}">Approve</button>` : ''}
          </div></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No targets yet.</td></tr>'}
        </table></div>
        <div class="note">Drafts generate from the “we just finished your neighbor\u2019s roof” templates with each address merged in. Approve each one — nothing sends itself.</div>`;
      $('#back', el).onclick = () => go('campaigns');
      $('#cp-flyer', el).onclick = () => go('flyer', id);
      $('#cp-add', el).onclick = async () => {
        const a = prompt('Neighbor address:');
        if (a) { await db.insert('campaign_targets', { campaign_id: id, address: a.trim() }); go('campaigns', id); }
      };
      $('#cp-gen', el).onclick = async () => {
        const emailTpl = TEMPLATES.find((t) => t.id === 'neighbor_done_email');
        const textTpl = TEMPLATES.find((t) => t.id === 'hail_check_text');
        let n = 0;
        for (const t of targets) {
          if (t.draft_id) continue;
          const street = t.address.replace(/^\d+\s*/, '');
          const ctx = Object.assign({}, jobCtx, { name: (t.name || 'there').split(' ')[0], address: t.address, street, city: 'Oklahoma City' });
          const filled = fillTemplate(textTpl, ctx);
          const nd = await db.insert('drafts', { kind: 'text', subject: filled.subject, body: filled.body, status: 'draft' });
          await db.update('campaign_targets', t.id, { draft_id: nd.id, status: 'drafted' });
          n++;
        }
        alert('Generated ' + n + ' text drafts. Review and approve each one.');
        go('campaigns', id);
      };
      $$('[data-tapprove]', el).forEach((b) => b.onclick = async () => {
        await db.update('drafts', +b.dataset.tapprove, { status: 'approved' });
        await db.update('campaign_targets', +b.dataset.tid, { status: 'approved' });
        go('campaigns', id);
      });
      const saveField = async (tid, field, val) => { await db.update('campaign_targets', tid, { [field]: val }); };
      $$('[data-tname]', el).forEach((i) => i.onchange = () => saveField(i.dataset.tname, 'name', i.value.trim()));
      $$('[data-tphone]', el).forEach((i) => i.onchange = () => saveField(i.dataset.tphone, 'phone', i.value.trim()));
    },
  };

  // ---------------- Flyer ----------------
  window.VIEWS.flyer = {
    async render(el, campaignId) {
      const crows = await db.list('campaigns', { select: '*, jobs(address)', where: { id: +campaignId } });
      const c = crows[0] || null;
      const jobAddress = c && c.jobs ? c.jobs.address : '';
      const co = S.settings;
      const site = 'https://www.highgroundokc.com';
      const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + encodeURIComponent(site);
      el.innerHTML = `
        <div class="toolbar no-print"><button class="ghost small" id="fl-back">← Back to campaign</button>
          <button id="fl-print">Print / Save PDF</button></div>
        <div class="flyer">
          <div class="flyer-brand">
            <div class="flyer-mark">HG</div>
            <div><div class="flyer-name">${h(co.company_name || 'High Ground Roofing & Construction')}</div>
            <div class="flyer-sub">Roofing · Exteriors · Insurance claims</div></div>
          </div>
          <h1 class="flyer-head">We just finished a roof<br>near you.</h1>
          ${jobAddress ? `<p class="flyer-job">${h(jobAddress)}</p>` : ''}
          <ul class="flyer-list">
            <li><b>Free drone roof inspections</b> — 15 minutes, photos included, no obligation</li>
            <li><b>Insurance claim handling</b> — we document the damage and work the claim with your adjuster</li>
            <li><b>Owens Corning shingles</b> — quality systems, installed to code</li>
          </ul>
          <p class="flyer-closer">Weathered a few Oklahoma hail seasons? We\u2019d be glad to take a free look.</p>
          <div class="flyer-contact">
            <div>
              <div class="flyer-phone">${h(co.company_phone || '(405) 252-0058')}</div>
              <div>${h(co.company_email || 'josh@highgroundokc.com')}</div>
              <div class="muted">${h(co.company_license || '')}</div>
            </div>
            <div class="flyer-qr">
              <img src="${qr}" alt="QR code" width="160" height="160">
              <div class="muted small">${h(site)}</div>
            </div>
          </div>
        </div>
        <div class="note no-print">Tip: in the print dialog choose “Save as PDF” to keep a digital copy, or print straight to the door-flyer stack.</div>`;
      $('#fl-back', el).onclick = () => go('campaigns', +campaignId);
      $('#fl-print', el).onclick = () => window.print();
    },
  };

  // ---------------- Settings ----------------
  window.VIEWS.settings = {
    async render(el) {
      const pb = S.priceBook;
      const itemNames = {};
      for (const it of SE.ITEMS) itemNames[it.key] = it.name;
      el.innerHTML = `
        <div class="two-col">
        <div>
          <div class="panel"><h2>Company</h2>
            <label>Company name</label><input id="s-coname" value="${h(S.settings.company_name || '')}">
            <div class="form-grid">
              <div><label>Phone</label><input id="s-cophone" value="${h(S.settings.company_phone || '')}"></div>
              <div><label>Email</label><input id="s-coemail" value="${h(S.settings.company_email || '')}"></div>
            </div>
            <label>Address</label><input id="s-coaddr" value="${h(S.settings.company_address || '')}">
            <label>License</label><input id="s-colic" value="${h(S.settings.company_license || '')}">
            <div class="mt"><button id="s-save-co">Save</button></div>
          </div>
          <div class="panel"><h2>Integrations <span class="muted">(owner adds the paid ones later)</span></h2>
            <div class="integ-list">
              <div class="integ"><span class="dot ok"></span>Gmail drafts <em>via Muse</em></div>
              <div class="integ"><span class="dot ${S.settings.twilio_sid ? 'ok' : 'no'}"></span>Twilio <em>${S.settings.twilio_sid ? 'connected' : 'owner adds'}</em></div>
              <div class="integ"><span class="dot ${S.settings.skiptrace_key ? 'ok' : 'no'}"></span>Skip trace <em>${S.settings.skiptrace_key ? 'connected' : 'owner adds'}</em></div>
            </div>
            <label>Twilio — Account SID</label><input id="s-tw-sid" value="${h(S.settings.twilio_sid || '')}" placeholder="Not connected">
            <label>Twilio — Auth token</label><input id="s-tw-tok" type="password" value="${h(S.settings.twilio_token || '')}" placeholder="Not connected">
            <label>Twilio — Phone number</label><input id="s-tw-phone" value="${h(S.settings.twilio_phone || '')}" placeholder="e.g. +14055550100">
            <label>Skip trace provider</label><select id="s-st-prov">
              ${['', 'batch', 'propstream', 'other'].map((p) => `<option value="${p}" ${S.settings.skiptrace_provider === p ? 'selected' : ''}>${p || '— not connected —'}</option>`).join('')}</select>
            <label>Skip trace API key</label><input id="s-st-key" type="password" value="${h(S.settings.skiptrace_key || '')}" placeholder="Not connected">
            <div class="mt"><button id="s-save-int">Save integrations</button></div>
            <div class="note">EagleView and Xactimate have no self-serve API — the app ingests their PDFs (Estimates tab). A real two-way sync needs a Verisk/EagleView partnership, which is the owner\u2019s call later.</div>
          </div>
          <div class="panel"><h2>Data</h2>
            <div class="row-actions"><button class="ghost" id="s-backup">Download backup (JSON)</button>
            <button class="danger" id="s-clear">Delete sample data</button></div>
            <div class="note">Backup everything before the business-owner handoff — it restores into a fresh install.</div>
            <h3>Import v1 desktop backup</h3>
            <p class="muted">Restore a backup JSON downloaded from the old desktop .exe into the cloud.</p>
            <input type="file" id="s-import" accept=".json,application/json">
            <p class="form-err" id="s-import-err"></p>
          </div>
        </div>
        <div class="panel"><h2>Price book <span class="muted">(planning defaults — set real Xactimate rates)</span></h2>
          <table><tr><th>Item</th><th>Unit</th><th>Price</th></tr>
          ${SE.ITEMS.map((it) => `<tr><td>${h(it.name)}</td><td class="muted">${it.unit}</td>
            <td><input type="number" step="any" data-pb="${it.key}" value="${pb[it.key] || 0}" style="width:100px"></td></tr>`).join('')}
          </table><div class="mt"><button id="s-save-pb">Save price book</button></div></div>
        </div>`;
      $('#s-save-co', el).onclick = async () => {
        await S.saveSetting('company_name', $('#s-coname', el).value.trim());
        await S.saveSetting('company_phone', $('#s-cophone', el).value.trim());
        await S.saveSetting('company_email', $('#s-coemail', el).value.trim());
        await S.saveSetting('company_address', $('#s-coaddr', el).value.trim());
        await S.saveSetting('company_license', $('#s-colic', el).value.trim());
        alert('Company info saved.');
      };
      $('#s-save-int', el).onclick = async () => {
        await S.saveSetting('twilio_sid', $('#s-tw-sid', el).value.trim());
        await S.saveSetting('twilio_token', $('#s-tw-tok', el).value.trim());
        await S.saveSetting('twilio_phone', $('#s-tw-phone', el).value.trim());
        await S.saveSetting('skiptrace_provider', $('#s-st-prov', el).value);
        await S.saveSetting('skiptrace_key', $('#s-st-key', el).value.trim());
        alert('Integration settings saved. Keys stay on this machine.');
      };
      $('#s-save-pb', el).onclick = async () => {
        $$('[data-pb]', el).forEach((i) => { S.priceBook[i.dataset.pb] = parseFloat(i.value) || 0; });
        await S.savePriceBook();
        alert('Price book saved.');
      };
      $('#s-backup', el).onclick = async () => {
        const json = await db.backup();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = 'highground-hq-backup.json';
        a.click();
      };
      $('#s-clear', el).onclick = async () => {
        if (!confirm('Delete all SAMPLE leads? (Real jobs and drafts stay.)')) return;
        await db.removeWhere('leads', { name: { op: 'like', val: 'SAMPLE%' } });
        alert('Sample leads deleted.');
        go('settings');
      };
      $('#s-import', el).onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const ok = confirm('Replace ALL cloud data with this desktop backup file? Leads, jobs, estimates, drafts and campaigns currently in the cloud will be wiped first, then the file is imported. This cannot be undone.');
        e.target.value = '';
        if (!ok) return;
        try {
          await db.importBackup(await f.text(), { wipe: true });
          alert('Import complete — reloading.');
          location.reload();
        } catch (err) {
          $('#s-import-err', el).textContent = 'Import failed: ' + err.message;
        }
      };
    },
  };
})();
</script>
<script>// High Ground HQ — views: HailScope (storm map), Photos (CompanyCam-style job photos).
(function () {
  'use strict';
  const { $, $$, h, fmtDate, db, go } = window.HQ;

  // OKC-metro city coordinates (shared with the morning digest cron).
  const CITY_COORDS = {
    'Oklahoma City': [35.4676, -97.5164], 'Edmond': [35.6528, -97.4781], 'Norman': [35.2220, -97.4395],
    'Moore': [35.3395, -97.4867], 'Midwest City': [35.4495, -97.3967], 'Del City': [35.4441, -97.4317],
    'Yukon': [35.5089, -97.7498], 'Mustang': [35.3864, -97.7221], 'Piedmont': [35.6400, -97.7490],
    'Choctaw': [35.4972, -97.2667], 'Bethany': [35.5050, -97.6333], 'Warr Acres': [35.5222, -97.6253],
    'Nichols Hills': [35.5467, -97.5417], 'The Village': [35.5639, -97.5567], 'Valley Brook': [35.4047, -97.4814],
    'Forest Park': [35.5067, -97.4717], 'Jones': [35.5689, -97.2892], 'Luther': [35.6656, -97.1903],
    'Harrah': [35.4756, -97.1647], 'Newalla': [35.4039, -97.1736], 'Noble': [35.1417, -97.3889],
    'Blanchard': [35.1478, -97.8725], 'Newcastle': [35.2467, -97.5964], 'Tuttle': [35.2934, -97.7489],
    'El Reno': [35.5322, -97.9551], 'Guthrie': [35.8779, -97.4253],
  };

  // Lazy-load Leaflet 1.9.4 from unpkg the first time HailScope opens.
  // Never a static <script src> — keeps the single-file demo bundle self-contained.
  function loadLeaflet() {
    return new Promise((resolve, reject) => {
      if (window.L) return resolve(window.L);
      const timer = setTimeout(() => reject(new Error('Leaflet timed out loading — check your connection')), 15000);
      const fail = (msg) => { clearTimeout(timer); reject(new Error(msg)); };
      const done = () => {
        clearTimeout(timer);
        if (window.L) resolve(window.L);
        else reject(new Error('Leaflet script loaded but window.L is missing'));
      };
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      link.onerror = () => fail('leaflet.css failed to load');
      document.head.appendChild(link);
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.crossOrigin = '';
      s.onload = done;
      s.onerror = () => fail('leaflet.js failed to load — check your connection');
      document.head.appendChild(s);
    });
  }

  // ---------------- HailScope (slim fork, HQ-owned) ----------------
  window.VIEWS.hailscope = {
    async render(el) {
      // Standalone HailScope fork: hail-first storm map, no Ground Control
      // tab bar. Needs a connection for tiles + NOAA hail data.
      el.innerHTML = `
        <iframe class="embed-frame" title="HailScope"
          src="https://joshuagwatts.github.io/high-ground-hq-demo/hailscope/"></iframe>
        <div class="note">HailScope storm map — tap the map or search an address for hail history. Needs a connection.</div>`;
    },
  };

  // ---------------- Photos ----------------
  window.VIEWS.photos = {
    async render(el) {
      let docs = [];
      try { docs = await db.list('documents', { orderBy: 'created_at', order: 'desc' }); } catch (e) {}
      const photos = docs.filter((d) => d.kind === 'photo' || String(d.mime || '').indexOf('image/') === 0);
      let jobs = [];
      try { jobs = await db.list('jobs', { select: 'id, address', orderBy: 'address' }); } catch (e) {}
      const jmap = {};
      jobs.forEach((j) => { jmap[j.id] = j.address; });
      const groups = [];
      const byJob = {};
      for (const p of photos) {
        const k = p.job_id != null ? String(p.job_id) : 'none';
        if (!byJob[k]) {
          byJob[k] = { addr: p.job_id != null ? (jmap[p.job_id] || 'Job #' + p.job_id) : 'No job', items: [] };
          groups.push(byJob[k]);
        }
        byJob[k].items.push(p);
      }

      el.innerHTML = `
        <div class="panel"><h2>Take photo</h2>
          <div class="form-grid">
            <div><label>Job</label><select id="ph-job"><option value="">— no job —</option>
              ${jobs.map((j) => `<option value="${j.id}">${h(j.address)}</option>`).join('')}</select></div>
            <div><label>Note</label><input id="ph-note" placeholder="e.g. front slope, ridge"></div>
          </div>
          <div class="mt row-actions">
            <button class="small" id="ph-take">📷 Take photo</button>
            <button class="ghost small" id="ph-pick">Choose file</button>
            <span class="muted small" id="ph-err"></span>
          </div>
          <p class="muted small">Photos save to the job and appear below, grouped by address.</p>
          <input type="file" id="ph-file-cam" accept="image/*" capture="environment" style="display:none">
          <input type="file" id="ph-file" accept="image/*" style="display:none">
        </div>
        ${groups.map((g) => `
          <div class="panel"><h3 class="photo-sub">${h(g.addr)} <span class="muted">(${g.items.length})</span></h3>
            <div class="photo-grid">
              ${g.items.map((p) => `
                <div class="photo-card" data-doc="${p.id}" role="button" tabindex="0">
                  <div class="ph-thumb" data-thumb="${p.id}"><span class="muted small">loading…</span></div>
                  <div class="ph-meta"><b>${h(p.filename || 'Photo')}</b>
                    <div class="muted small">${fmtDate(p.created_at)}${p.note ? ' — ' + h(p.note) : ''}</div></div>
                </div>`).join('')}
            </div></div>`).join('') ||
          '<div class="panel"><p class="muted">No photos yet. Tap "Take photo" on a job — shots land here under the job address.</p></div>'}`;

      const doUpload = async (input) => {
        const f = input.files[0];
        input.value = '';
        if (!f) return;
        const errEl = $('#ph-err', el);
        try {
          const row = await db.insert('documents', {
            job_id: $('#ph-job', el).value || null, lead_id: null,
            kind: 'photo', filename: f.name || 'photo.jpg',
            note: $('#ph-note', el).value.trim(),
            mime: f.type || 'image/jpeg', storage_path: '',
          });
          try { await window.HQ.docs.put(row.id, f); }
          catch (err2) { if (errEl) errEl.textContent = 'Saved the record, but the photo could not be stored on this device: ' + err2.message; }
          go('photos');
        } catch (err) { if (errEl) errEl.textContent = 'Could not save photo: ' + err.message; }
      };
      $('#ph-take', el).onclick = () => $('#ph-file-cam', el).click();
      $('#ph-pick', el).onclick = () => $('#ph-file', el).click();
      $('#ph-file-cam', el).onchange = (e) => doUpload(e.target);
      $('#ph-file', el).onchange = (e) => doUpload(e.target);

      // thumbnails from the same IndexedDB bytes the job-docs feature stores
      for (const p of photos) {
        window.HQ.docs.get(p.id).then((blob) => {
          if (!el.isConnected) return;
          const slot = el.querySelector(`[data-thumb="${p.id}"]`);
          if (!slot) return;
          slot.innerHTML = blob
            ? `<img src="${URL.createObjectURL(blob)}" alt="">`
            : '<span class="muted small">no image on this device</span>';
        }).catch(() => { /* leave placeholder */ });
      }

      const openLb = async (id) => {
        const p = photos.find((x) => x.id === id);
        if (!p) return;
        let imgHtml = '<p class="muted">No image stored on this device.</p>';
        try {
          const blob = await window.HQ.docs.get(id);
          if (blob) imgHtml = `<img src="${URL.createObjectURL(blob)}" alt="">`;
        } catch (e) {}
        const lb = document.createElement('div');
        lb.className = 'lightbox';
        lb.innerHTML = `<div class="lb-inner">${imgHtml}
          <div class="lb-cap"><b>${h(p.filename || 'Photo')}</b> <span class="muted">${fmtDate(p.created_at)}${p.note ? ' — ' + h(p.note) : ''}</span></div></div>`;
        lb.onclick = () => lb.remove();
        document.body.appendChild(lb);
      };
      $$('.photo-card', el).forEach((card) => {
        card.onclick = () => openLb(+card.dataset.doc);
        card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(+card.dataset.doc); } };
      });
    },
  };
})();
</script>
