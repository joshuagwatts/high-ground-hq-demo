<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Ground HQ — demo</title>
<style>:root {
  --bg: #0e1218; --panel: #151b25; --panel2: #1a2230; --line: #243040;
  --text: #e9eef5; --muted: #8d99ab; --accent: #f0a22e; --accent-d: #c77f16;
  --green: #3ecf8e; --red: #f26d6d; --blue: #5aa9ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }
#topheader { display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.brand { display: flex; gap: 10px; align-items: center; cursor: pointer; user-select: none; }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent);
  color: #14100a; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.brand-name { font-weight: 700; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 12px; }
.header-right { display: flex; align-items: center; gap: 12px; }
#global-search { width: 280px; margin: 0; }
#nav { display: flex; gap: 2px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 0 12px; overflow-x: auto; flex-shrink: 0; }
#nav button { background: none; border: none; border-bottom: 3px solid transparent; border-radius: 0;
  color: var(--muted); padding: 12px 16px 9px; font-size: 14px; font-weight: 600; cursor: pointer;
  white-space: nowrap; display: inline-flex; flex-direction: row; align-items: center; gap: 7px; }
#nav button:hover { color: var(--text); background: var(--panel2); }
#nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-ico { font-size: 13px; opacity: .8; }
.integ-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.integ { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.integ em { font-style: normal; opacity: .7; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--green); } .dot.no { background: #5a6577; }
.ver { margin-top: 6px; opacity: .6; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--line); }
#topbar h1 { margin: 0; font-size: 20px; }
#topbar-actions { display: flex; gap: 8px; }
#view { padding: 24px; overflow-y: auto; flex: 1; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.card .v { font-size: 28px; font-weight: 700; margin-top: 4px; }
.card .v.amber { color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px; margin-bottom: 18px; }
.panel h2 { margin: 0 0 12px; font-size: 16px; }
.panel h3 { margin: 18px 0 8px; font-size: 14px; color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
tr:hover td { background: var(--panel2); }
button, .btn { background: var(--accent); color: #14100a; border: none; border-radius: 8px;
  padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
button:hover, .btn:hover { background: var(--accent-d); }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.ghost:hover { border-color: var(--accent); color: var(--accent); }
button.small { padding: 5px 10px; font-size: 12px; }
button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 9px 12px; font-size: 14px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { min-height: 120px; font-family: inherit; resize: vertical; }
label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px;
  text-transform: uppercase; letter-spacing: .05em; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 14px; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.b-lead { background: #2a3a55; color: var(--blue); }
.b-contacted { background: #3a2f1a; color: var(--accent); }
.b-customer { background: #173a2c; color: var(--green); }
.b-estimate { background: #2a3a55; color: var(--blue); }
.b-in_progress, .b-supplement { background: #3a2f1a; color: var(--accent); }
.b-completed, .b-approved, .b-sent { background: #173a2c; color: var(--green); }
.b-draft, .b-pending { background: #333c4d; color: var(--muted); }
.b-email { background: #2a3a55; color: var(--blue); }
.b-text { background: #173a2c; color: var(--green); }
.b-call { background: #3a2f1a; color: var(--accent); }
.row-actions { display: flex; gap: 6px; }
.muted { color: var(--muted); }
.mt { margin-top: 14px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
.note { background: var(--panel2); border-left: 3px solid var(--accent); padding: 10px 14px;
  border-radius: 0 8px 8px 0; color: var(--muted); font-size: 13px; margin: 12px 0; }
.total-row td { font-weight: 700; border-top: 2px solid var(--line); }
.miss { color: var(--accent); font-weight: 600; }
.covered { color: var(--green); }
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar input { width: auto; min-width: 240px; }
.steps { display: flex; gap: 8px; margin-bottom: 18px; }
.steps button { flex: 1; }
.steps button.done { background: #173a2c; color: var(--green); }
pre.copybox { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; white-space: pre-wrap; font-size: 13px; max-height: 300px; overflow-y: auto; }

/* ---- login screen ---- */
.login-panel { max-width: 420px; margin: 8vh auto; }
.form-err { color: var(--red); font-size: 13px; min-height: 20px; margin: 8px 0; }
.form-err:empty { display: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.small { font-size: 12px; }
button.primary, .btn.primary { background: var(--accent); color: #14100a; }

/* ---- consolidation additions: audit, pipeline, scopes, docs, flyer ---- */
.scope-row { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
.scope-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
  color: var(--text); text-transform: none; letter-spacing: 0; margin: 4px 0; cursor: pointer; }
.scope-group { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; padding: 4px 14px 14px; }
.scope-group summary { cursor: pointer; font-weight: 700; padding: 10px 0; color: var(--accent); }
.audit td { vertical-align: top; }
.adot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.adot.flag { background: var(--red); } .adot.info { background: var(--blue); } .adot.pass { background: var(--green); }
tr.audit-flag td { background: rgba(242, 109, 109, .07); }
tr.phase-row td { background: var(--panel2); font-weight: 700; color: var(--accent);
  text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
.pipeline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.pipeline button:disabled { opacity: 1; cursor: default; background: var(--accent); color: #14100a; }
.pipeline button.done { background: #173a2c; color: var(--green); }
.pipe-arrow { color: var(--muted); }
.doc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--line); }

/* ---- flyer (print-ready) ---- */
.flyer { background: #fff; color: #111; border-radius: 12px; padding: 48px; max-width: 720px; margin: 0 auto; }
.flyer-brand { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
.flyer-mark { width: 56px; height: 56px; border-radius: 12px; background: #f0a22e; color: #14100a;
  font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.flyer-name { font-weight: 800; font-size: 20px; color: #111; }
.flyer-sub { color: #555; font-size: 13px; }
.flyer-head { font-size: 44px; line-height: 1.15; color: #111; margin: 0 0 10px; }
.flyer-job { font-size: 17px; color: #444; margin: 0 0 22px; }
.flyer-list { font-size: 16px; line-height: 1.7; color: #222; padding-left: 22px; margin: 0 0 22px; }
.flyer-closer { font-size: 16px; color: #333; margin: 0 0 30px; }
.flyer-contact { display: flex; justify-content: space-between; align-items: center; gap: 20px;
  border-top: 3px solid #f0a22e; padding-top: 22px; }
.flyer-phone { font-size: 26px; font-weight: 800; color: #111; }
.flyer-qr { text-align: center; }

/* ---- HailScope ---- */
#hail-map { width: 100%; min-height: 60vh; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line); margin-bottom: 18px; background: var(--panel); }
#hail-map .leaflet-container { min-height: 60vh; background: #0e1218; font: inherit; }
.hs-pin .hs-dot { width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
  color: #14100a; font-weight: 800; font-size: 11px; display: flex; align-items: center;
  justify-content: center; border: 2px solid rgba(255,255,255,.25); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.hs-pop { font-size: 13px; color: #111; }
.hs-pop button { margin-top: 6px; }

/* ---- Photos ---- */
.photo-sub { margin: 0 0 10px; font-size: 14px; color: var(--accent); }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.photo-card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; cursor: pointer; }
.photo-card:hover { border-color: var(--accent); }
.photo-card .ph-thumb { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg); overflow: hidden; }
.photo-card .ph-thumb img { width: 100%; height: 100%; object-fit: cover; }
.ph-meta { padding: 8px 10px; font-size: 12px; }
.lightbox { position: fixed; inset: 0; background: rgba(4,6,10,.92); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
.lb-inner img { max-width: 92vw; max-height: 80vh; border-radius: 8px; }
.lb-cap { margin-top: 8px; text-align: center; }

@media print {
  #topheader, #nav, #topbar, .no-print, .note.no-print { display: none !important; }
  body { background: #fff; }
  #app { display: block; height: auto; }
  #view { padding: 0; overflow: visible; }
  .flyer { border-radius: 0; max-width: none; }
}

/* ---- phones (<=720px): header compacts, tabs scroll, everything stacks ---- */
@media (max-width: 720px) {
  #app { flex-direction: column; height: auto; min-height: 100vh; }
  #topheader { padding: 8px 12px; flex-wrap: wrap; gap: 8px; }
  .brand { margin-bottom: 0; flex-shrink: 0; }
  .brand-sub { display: none; }
  .brand-mark { width: 32px; height: 32px; font-size: 13px; }
  .brand-name { font-size: 14px; }
  #global-search { width: 100%; order: 3; }
  #user-email { display: none; }
  #nav { padding: 0 4px; gap: 6px; padding-bottom: 2px; }
  #nav button { padding: 10px 12px 7px; font-size: 13px; flex-shrink: 0; }
  main { width: 100%; }
  #topbar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  #topbar h1 { font-size: 18px; }
  #topbar-actions { width: 100%; }
  #topbar-actions button { flex: 1 1 auto; }
  #view { padding: 16px; }
  .panel { overflow-x: auto; }
  table { min-width: 560px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar input, .toolbar select, .toolbar button { width: 100%; min-width: 0; }
  input, select, textarea { width: 100%; min-height: 44px; font-size: 16px; }
  button, .btn { min-height: 44px; }
  .row-actions { flex-wrap: wrap; }
  .row-actions button { flex: 1 1 auto; }
  .steps { flex-direction: column; }
  .form-grid { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr 1fr; }
  .login-panel { margin: 4vh auto; }
  .pipeline { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
  .pipeline button { flex-shrink: 0; }
  .flyer { padding: 28px 22px; }
  .flyer-head { font-size: 32px; }
  .flyer-contact { flex-direction: column; align-items: flex-start; }
  .doc-row { flex-direction: column; align-items: stretch; }
  #hail-map, #hail-map .leaflet-container { min-height: 70vh; }
  .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
}
</style>
</head>

(function () {

    ],

      { id: 1, date: '2026-05-18', city: 'Moore', lat: 35.3395, lon: -97.4867, size_in: 1.75, source: 'demo', source_url: '', created_at: '2026-05-19T10:00:00Z' },
      { id: 2, date: '2026-04-29', city: 'Edmond', lat: 35.6528, lon: -97.4781, size_in: 2.5, source: 'demo', source_url: '', created_at: '2026-04-30T10:00:00Z' },
    ],
  };

  // FK map for embedded selects: table -> { fkCol: [refTable] }
  var FKS = {
    jobs: { lead_id: 'leads' },
    estimates: { job_id: 'jobs' },
    drafts: { lead_id: 'leads', job_id: 'jobs' },
    campaigns: { job_id: 'jobs' },
    campaign_targets: { campaign_id: 'campaigns', draft_id: 'drafts' },
  };

  function likeToReg(src, pat, ci) {
    var esc = String(pat).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.');
    return new RegExp('^' + esc + '$', ci ? 'i' : '');
  }

  function pick(obj, cols) {
    if (!cols) return Object.assign({}, obj);
    var parts = cols.split(',').map(function (c) { return c.trim(); });
    var out = {};
    if (parts.indexOf('*') >= 0) Object.assign(out, obj); // real PostgREST '*' = all columns
    parts.forEach(function (c) {
      if (c && c !== '*' && !/\(/.test(c)) out[c] = obj[c];
    });
    return out;
  }

  function embed(row, table, select) {
    var out = pick(Object.assign({}, row), select);
    var re = /(\w+)\(([^)]+)\)/g, m;
    var fks = FKS[table] || {};
    while ((m = re.exec(select || ''))) {
      var refTable = m[1], cols = m[2].split(',').map(function (c) { return c.trim(); });
      var fkCol = Object.keys(fks).find(function (k) { return fks[k] === refTable; });
      var ref = fkCol && row[fkCol] != null
        ? (store[refTable] || []).find(function (r) { return r.id === row[fkCol]; })
        : null;
      out[refTable] = ref ? pick(ref, cols.join(',')) : null;
    }
    return out;
  }

  function execute(state) {
    var rows = (store[state.table] || []).slice();

    if (state.op === 'insert') {
      var maxId = rows.reduce(function (m, r) { return Math.max(m, r.id || 0); }, 0);
      var row = Object.assign({ id: maxId + 1, created_at: new Date().toISOString() }, state.payload);
      store[state.table].push(row);
      return { data: [embed(row, state.table, state.select)], error: null };
    }
    if (state.op === 'update') {
      var updated = [];
      store[state.table] = rows.map(function (r) {
        if (state.filters.every(function (f) { return f(r); })) {
          var nr = Object.assign({}, r, state.payload);
          updated.push(nr);
          return nr;
        }
        return r;
      });
      return { data: updated.map(function (r) { return embed(r, state.table, state.select); }), error: null };
    }
    if (state.op === 'upsert') {
      var key = state.onConflict;
      var idx = store[state.table].findIndex(function (r) { return r[key] === state.payload[key]; });
      var outRow;
      if (idx >= 0) {
        outRow = Object.assign({}, store[state.table][idx], state.payload);
        store[state.table][idx] = outRow;
      } else {
        var mx = store[state.table].reduce(function (m, r) { return Math.max(m, r.id || 0); }, 0);
        outRow = Object.assign({ created_at: new Date().toISOString() }, state.payload);
        if (outRow.id == null && state.table !== 'settings') outRow.id = mx + 1;
        store[state.table].push(outRow);
      }
      return { data: [embed(outRow, state.table, state.select)], error: null };
    }
    if (state.op === 'delete') {
      var kept = rows.filter(function (r) { return !state.filters.every(function (f) { return f(r); }); });
      var n = rows.length - kept.length;
      store[state.table] = kept;
      return { data: [], count: n, error: null };
    }

    // select
    rows = rows.filter(function (r) { return state.filters.every(function (f) { return f(r); }); });
    if (state.order) {
      var c = state.order.col, asc = state.order.ascending;
      rows.sort(function (a, b) {
        var x = a[c], y = b[c];
        if (x == null && y == null) return 0;
        if (x == null) return asc ? 1 : -1;
        if (y == null) return asc ? -1 : 1;
        return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1);
      });
    }
    if (state.limit) rows = rows.slice(0, state.limit);
    if (state.head) return { data: [], count: rows.length, error: null };
    return { data: rows.map(function (r) { return embed(r, state.table, state.select); }), error: null };
  }

  function builder(table) {
    var state = { table: table, filters: [], order: null, limit: null, select: '*', head: false, op: 'select', payload: null, onConflict: null };
    var b = {
      select: function (cols, opts) {
        state.select = cols || '*';
        if (opts && opts.count) state.wantCount = true;
        if (opts && opts.head) state.head = true;
        return b;
      },
      eq: function (col, v) { state.filters.push(function (r) { return r[col] === v; }); return b; },
      neq: function (col, v) { state.filters.push(function (r) { return r[col] !== v; }); return b; },
      like: function (col, pat) { var re = likeToReg(0, pat, false); state.filters.push(function (r) { return re.test(String(r[col] == null ? '' : r[col])); }); return b; },
      ilike: function (col, pat) { var re = likeToReg(0, pat, true); state.filters.push(function (r) { return re.test(String(r[col] == null ? '' : r[col])); }); return b; },
      in: function (col, arr) { state.filters.push(function (r) { return arr.indexOf(r[col]) >= 0; }); return b; },
      not: function (col, op, val) {
        if (op === 'in') {
          var vals = String(val).replace(/^\(|\)$/g, '').split(',');
          state.filters.push(function (r) { return vals.indexOf(String(r[col])) < 0; });
        }
        return b;
      },
      is: function (col, v) { state.filters.push(function (r) { return r[col] === v; }); return b; },
      gte: function (col, v) { state.filters.push(function (r) { return r[col] >= v; }); return b; },
      lte: function (col, v) { state.filters.push(function (r) { return r[col] <= v; }); return b; },
      or: function (str) {
        var parts = [];
        var re = /(\w+)\.ilike\."%([^"]*)%"/g, m;
        while ((m = re.exec(str))) parts.push({ col: m[1], term: m[2].toLowerCase() });
        state.filters.push(function (r) {
          return parts.some(function (p) { return String(r[p.col] == null ? '' : r[p.col]).toLowerCase().indexOf(p.term) >= 0; });
        });
        return b;
      },
      order: function (col, opts) { state.order = { col: col, ascending: !opts || opts.ascending !== false }; return b; },
      limit: function (n) { state.limit = n; return b; },
      insert: function (obj) { state.op = 'insert'; state.payload = obj; return b; },
      update: function (obj) { state.op = 'update'; state.payload = obj; return b; },
      upsert: function (obj, opts) { state.op = 'upsert'; state.payload = obj; state.onConflict = opts && opts.onConflict; return b; },
      delete: function () { state.op = 'delete'; return b; },
      single: function () {
        var res = execute(state);
        return Promise.resolve({ data: (res.data && res.data[0] != null) ? res.data[0] : null, error: res.error });
      },
      then: function (resolve) { resolve(execute(state)); },
    };
    return b;
  }

  // ---- auth mock: starts signed OUT so the login screen is exercised ----
  var users = [];
  var session = null;
  var authListeners = [];

  var auth = {
    getSession: function () { return Promise.resolve({ data: { session: session } }); },
    signUp: function (creds) {
      if (users.some(function (u) { return u.email === creds.email; })) {
        return Promise.resolve({ error: { message: 'User already registered' } });
      }
      users.push({ email: creds.email, password: creds.password });
      return Promise.resolve({ data: { user: { email: creds.email } }, error: null });
    },
    signInWithPassword: function (creds) {
      var u = users.find(function (x) { return x.email === creds.email && x.password === creds.password; });
      if (!u) return Promise.resolve({ error: { message: 'Invalid login credentials' } });
      session = { user: { email: u.email } };
      return Promise.resolve({ data: { session: session }, error: null });
    },
    signOut: function () { session = null; return Promise.resolve({ error: null }); },
    onAuthStateChange: function (cb) {
      authListeners.push(cb);
      return { data: { subscription: { unsubscribe: function () {} } } };
    },
  };

  window.supabaseLib = {
    createClient: function () {
      return { from: builder, auth: auth };
    },
  };
  // test seam: inspect/reset store from the driver
  window.__mockStore = store;
})();

<script>// High Ground HQ — cloud data layer (Supabase/Postgres).
// Replaces the old Electron window.hq raw-SQL bridge. Every view talks to
// HQ.db through this small table-oriented API; no raw SQL in the browser.
//
// where-filters: { col: value } for equality, or
//   { col: { op: 'like'|'ilike'|'in'|'neq', val: ... } } for operators.
(function () {
  'use strict';

  var ESM_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  var client = null;

  async function supabaseLib() {
    if (window.supabaseLib) return window.supabaseLib; // Electron v2 preload (bundled npm pkg)
    return await import(ESM_URL);                       // hosted web build
  }

  async function getClient() {
    if (client) return client;
    var cfg = window.HQ_CONFIG || {};
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
      throw new Error('Missing Supabase config — renderer/config.js was not created at deploy time.');
    }
    var lib = await supabaseLib();
    client = lib.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    return client;
  }

  function applyWhere(q, where) {
    var entries = Object.entries(where || {});
    for (var i = 0; i < entries.length; i++) {
      var col = entries[i][0], val = entries[i][1];
      if (val !== null && typeof val === 'object' && val.op) {
        if (val.op === 'like') q = q.like(col, val.val);
        else if (val.op === 'ilike') q = q.ilike(col, val.val);
        else if (val.op === 'in') q = q.in(col, val.val);
        else if (val.op === 'neq') q = q.neq(col, val.val);
        else if (val.op === 'nin') q = q.not(col, 'in', '(' + val.val.join(',') + ')');
        else if (val.op === 'gte') q = q.gte(col, val.val);
        else if (val.op === 'lte') q = q.lte(col, val.val);
      } else if (val === null) {
        q = q.is(col, null);
      } else {
        q = q.eq(col, val);
      }
    }
    return q;
  }

  // Dependency order for full wipes / imports (parents before children).
  var DATA_TABLES = ['campaign_targets', 'campaigns', 'drafts', 'estimates', 'jobs', 'leads'];
  var ALL_TABLES = ['leads', 'jobs', 'estimates', 'drafts', 'campaigns', 'campaign_targets', 'settings'];

  var db = {
    async list(table, opts) {
      opts = opts || {};
      var sb = await getClient();
      var q = sb.from(table).select(opts.select || '*');
      q = applyWhere(q, opts.where);
      if (opts.orderBy) q = q.order(opts.orderBy, { ascending: (opts.order || 'asc') === 'asc' });
      if (opts.limit) q = q.limit(opts.limit);
      var res = await q;
      if (res.error) throw res.error;
      return res.data;
    },

    async get(table, id) {
      var rows = await this.list(table, { where: { id: id }, limit: 1 });
      return rows[0] || null;
    },

    async insert(table, obj) {
      var sb = await getClient();
      var res = await sb.from(table).insert(obj).select().single();
      if (res.error) throw res.error;
      return res.data;
    },

    async update(table, id, obj) {
      var sb = await getClient();
      var res = await sb.from(table).update(obj).eq('id', id).select().single();
      if (res.error) throw res.error;
      return res.data;
    },

    async upsert(table, obj, onConflict) {
      var sb = await getClient();
      var res = await sb.from(table).upsert(obj, { onConflict: onConflict }).select().single();
      if (res.error) throw res.error;
      return res.data;
    },

    async remove(table, id) {
      var sb = await getClient();
      var res = await sb.from(table).delete().eq('id', id);
      if (res.error) throw res.error;
    },

    async removeWhere(table, where) {
      var sb = await getClient();
      var q = sb.from(table).delete();
      var keys = Object.keys(where || {});
      if (keys.length === 0) q = q.neq('id', 0); // match-all wipe (identity pks start at 1)
      else q = applyWhere(q, where);
      var res = await q;
      if (res.error) throw res.error;
    },

    async count(table, where) {
      var sb = await getClient();
      var q = applyWhere(sb.from(table).select('id', { count: 'exact', head: true }), where);
      var res = await q;
      if (res.error) throw res.error;
      return res.count || 0;
    },

    // OR search across columns: ilike "contains" on each of opts.cols.
    // opts: { select, cols: [...], term: '...', where, orderBy, order, limit }
    async search(table, opts) {
      opts = opts || {};
      var sb = await getClient();
      var q = sb.from(table).select(opts.select || '*');
      q = applyWhere(q, opts.where);
      if (opts.term && opts.cols && opts.cols.length) {
        // double-quote each pattern so commas/parens in the term can't split the or() list
        var t = String(opts.term).replace(/"/g, '');
        var ors = opts.cols.map(function (c) { return c + '.ilike."%' + t + '%"'; }).join(',');
        q = q.or(ors);
      }
      if (opts.orderBy) q = q.order(opts.orderBy, { ascending: (opts.order || 'asc') === 'asc' });
      if (opts.limit) q = q.limit(opts.limit);
      var res = await q;
      if (res.error) throw res.error;
      return res.data;
    },

    // ---- auth (Supabase Auth, email+password) ----
    async session() {
      var sb = await getClient();
      return sb.auth.getSession().then(function (r) { return r.data.session; });
    },
    async signIn(email, password) {
      var sb = await getClient();
      return sb.auth.signInWithPassword({ email: email, password: password });
    },
    async signUp(email, password) {
      var sb = await getClient();
      return sb.auth.signUp({ email: email, password: password });
    },
    async signOut() {
      var sb = await getClient();
      return sb.auth.signOut();
    },
    onAuthChange(cb) {
      getClient().then(function (sb) {
        sb.auth.onAuthStateChange(function (_evt, session) { cb(session); });
      });
    },

    // ---- full JSON backup of every table (Settings -> Download backup) ----
    async backup() {
      var dump = {};
      for (var i = 0; i < ALL_TABLES.length; i++) {
        var t = ALL_TABLES[i];
        dump[t] = await this.list(t, { orderBy: t === 'settings' ? 'key' : 'id' });
      }
      return JSON.stringify(dump, null, 2);
    },

    // ---- import a v1 desktop backup JSON (Settings -> Download backup in the old .exe).
    // Wipes cloud data tables first (fresh cutover), remaps ids so FKs stay
    // consistent, and upserts settings (so price-book edits merge, not dup).
    async importBackup(json, opts) {
      opts = opts || {};
      var dump = typeof json === 'string' ? JSON.parse(json) : json;
      var wipe = opts.wipe !== false;
      var self = this;

      if (wipe) {
        for (var i = 0; i < DATA_TABLES.length; i++) {
          await self.removeWhere(DATA_TABLES[i], {});
        }
      }

      if (dump.settings) {
        for (var s = 0; s < dump.settings.length; s++) {
          await self.upsert('settings', { key: dump.settings[s].key, value: dump.settings[s].value }, 'key');
        }
      }

      // id remap: oldId -> newId per table, applied to FK columns on insert.
      var idMap = { leads: {}, jobs: {}, drafts: {}, campaigns: {} };
      var fkFix = {
        jobs: ['lead_id'],
        estimates: ['job_id'],
        drafts: ['lead_id', 'job_id'],
        campaigns: ['job_id'],
        campaign_targets: ['campaign_id', 'draft_id'],
      };
      var order = ['leads', 'jobs', 'estimates', 'drafts', 'campaigns', 'campaign_targets'];

      for (var t = 0; t < order.length; t++) {
        var table = order[t];
        var rows = dump[table] || [];
        for (var r = 0; r < rows.length; r++) {
          var src = Object.assign({}, rows[r]);
          var oldId = src.id;
          delete src.id;
          delete src.created_at; // let the cloud stamp fresh times
          var fks = fkFix[table] || [];
          for (var f = 0; f < fks.length; f++) {
            var col = fks[f];
            var refTable = col.replace(/_id$/, '') + 's';
            if (refTable === 'campaings') refTable = 'campaigns';
            if (src[col] && idMap[refTable] && idMap[refTable][src[col]]) {
              src[col] = idMap[refTable][src[col]];
            }
          }
          // drop FKs that point at rows not in this backup (orphans)
          for (var f2 = 0; f2 < fks.length; f2++) {
            var col2 = fks[f2];
            var ref2 = col2.replace(/_id$/, '') + 's';
            if (src[col2] && !(idMap[ref2] && idMap[ref2][src[col2]])) src[col2] = null;
          }
          var inserted = await self.insert(table, src);
          if (idMap[table]) idMap[table][oldId] = inserted.id;
        }
      }
      return true;
    },
  };

  window.HQ_CLOUD_DB = db;
})();
</script>

    { id: 'starter',     label: 'Starter course', check: (m, has) =>
      !m.roofSQ ? null : has('starter') ? pass('Starter included') : flag('Shingles without starter course') },
    { id: 'ridge_cap',   label: 'Hip & ridge cap', check: (m, has) =>
      !(m.ridgesLF + m.hipsLF > 0) ? null : has('ridge_cap') ? pass('Ridge cap covers ' + (m.ridgesLF + m.hipsLF) + ' LF') : flag('Ridges/hips with no cap line') },
    { id: 'ice_water',   label: 'Ice & water shield', check: (m, has) =>
      !(m.valleysLF > 0 || m.eavesLF > 0) ? null : has('ice_water') ? pass('Valleys + eaves covered') : flag('Valleys/eaves with no ice & water') },
    { id: 'drip_edge',   label: 'Drip edge', check: (m, has) =>
      !(m.eavesLF + m.rakesLF > 0) ? null : has('drip_edge') ? pass('Eaves + rakes covered') : flag('Eaves/rakes with no drip edge') },
    { id: 'waste',       label: 'Waste factor ≥ 10%', check: (m) =>
      !(m.wastePct > 0) ? null : m.wastePct >= 10 ? pass(m.wastePct + '% waste') : flag('Waste only ' + m.wastePct + '% — bump to 10%+') },
    { id: 'tearoff',     label: 'Tear-off specified', check: (m, has) =>
      !m.roofSQ ? null : has('haul_off') ? pass('Haul-off on the sheet') : flag('No tear-off / haul-off line') },
    { id: 'ventilation', label: 'Ventilation', check: (m, has) =>
      !m.roofSQ ? null : has('ridge_vent') ? pass('Ridge vent included') : info('No ridge vent — verify ventilation') },
    { id: 'pipes',       label: 'Pipe flashing', check: (m, has) =>
      !(m.pipeCount > 0) ? null : has('pipe_boot') ? pass(m.pipeCount + ' boot(s)') : flag(m.pipeCount + ' pipe(s) with no boots') },
    { id: 'step_flash',  label: 'Step flashing', check: (m, has) =>
      !(m.stepFlashingLF > 0) ? null : has('step_flashing') ? pass(m.stepFlashingLF + ' LF') : flag('Roof-to-wall with no step flashing') },
    { id: 'valley',      label: 'Valley metal', check: (m, has) =>
      !(m.valleysLF > 0) ? null : has('valley_metal') ? pass(m.valleysLF + ' LF') : flag('Valleys with no metal') },
    { id: 'gutter_rr',   label: 'Gutter detach/reset (redeck)', check: (m, has) =>
      !has('redeck') ? null : has('gutter_rr') ? pass('Gutters detach/reset on redeck') : flag('Redeck without gutter detach/reset — adjusters miss this') },
    { id: 'ext_raise',   label: 'Exterior raise (redeck)', check: (m, has) =>
      !has('redeck') ? null : (has('paint_touchup') || has('siding_detach_reset') || has('fascia_replace')) ? pass('Exterior raise accounted') : flag('Redeck without exterior raise (fascia/siding at roof lines)') },
    { id: 'op',          label: 'Overhead & profit', check: (m, has, trades) =>
      trades.size < 3 ? info('Only ' + trades.size + ' trade(s) — O&P needs 3+') : pass(trades.size + ' trades — O&P applied') },
    { id: 'permit',      label: 'Permit', check: (m, has) =>
      has('permit') ? pass('Permit on the sheet') : info('No permit line — add if the city requires it') },
  ];
  function pass(detail) { return { status: 'pass', detail }; }
  function flag(detail) { return { status: 'flag', detail }; }
  function info(detail) { return { status: 'info', detail }; }

  function runAudit(measurements, result) {
    const itemKeys = new Set(result.items.map((i) => i.key));
    const has = (k) => itemKeys.has(k);
    const out = [];
    for (const rule of AUDIT_RULES) {
      let r;
      try { r = rule.check(measurements, has, new Set(result.trades)); }
      catch (e) { r = info('check error'); }
      if (!r) continue; // not applicable
      out.push({ id: rule.id, label: rule.label, status: r.status, detail: r.detail });
    }
    return out;
  }
  const COVERAGE = [
    { key: 'shingles',     rx: /RFG\s*(240|300|230)|laminated|composition shingle/i },
    { key: 'underlayment', rx: /RFG\s*(200|210)|#?15[-\s]?lb|felt|synthetic underlayment/i },
    { key: 'redeck',       rx: /re-?deck|sheathing|\bOSB\b|plywood|RFG\s*105/i },
    { key: 'ice_water',    rx: /ice|water (shield|barrier)|leak barrier/i },
    { key: 'drip_edge',    rx: /drip edge/i },
    { key: 'starter',      rx: /starter/i },
    { key: 'ridge_vent',   rx: /ridge vent|ventilation/i },
    { key: 'ridge_cap',    rx: /RFG\s*410|ridge cap|hip & ridge|hip and ridge/i },
    { key: 'valley_metal', rx: /RFG\s*62\d|valley/i },
    { key: 'pipe_boot',    rx: /pipe (jack|flashing|boot)/i },
    { key: 'step_flashing',rx: /step flashing/i },
    { key: 'wall_flash',   rx: /headwall|wall flashing|counter flashing/i },
    { key: 'chimney_flash',rx: /chimney/i },
    { key: 'skylight_rr',  rx: /skylight/i },
    { key: 'satellite_rr', rx: /satellite|dish/i },
    { key: 'gutter_rr',    rx: /RFG\s*70\d|gutter|downspout/i },
    { key: 'haul_off',     rx: /haul|debris|dumpster|dump fee/i },
    { key: 'permit',       rx: /permit/i },
  ];

  function coveredKeys(adjusterText) {
    const found = new Set();
    if (!adjusterText) return found;
    for (const c of COVERAGE) if (c.rx.test(adjusterText)) found.add(c.key);
    return found;
  }

  // O&P: 10% overhead + 10% profit when 3+ trades are on the supplement.
  function applyOP(items, subtotal) {
    const trades = new Set(items.filter((i) => i.qty > 0).map((i) => i.trade));
    if (trades.size < 3) return { items, opLines: [], trades: [...trades] };
    const oh = +(subtotal * 0.1).toFixed(2);
    const pf = +(subtotal * 0.1).toFixed(2);
    return {
      items,
      opLines: [
        { key: 'overhead', name: 'Overhead (10%)', unit: '%', qty: 10, price: +(subtotal / 100).toFixed(2), total: oh },
        { key: 'profit',   name: 'Profit (10%)',   unit: '%', qty: 10, price: +(subtotal / 100).toFixed(2), total: pf },
      ],
      trades: [...trades],
    };
  }

  // measurements: {roofSQ, eavesLF, rakesLF, ridgesLF, hipsLF, valleysLF,
  //   stepFlashingLF, wallFlashingLF, pipeCount, chimneyCount, skylightCount,
  //   satelliteCount, ...extended fields below}
  // opts: {priceBook, adjusterText, includeCovered=false, qtyOverrides={},
  //   scopes={roof:true}}
  function buildSupplement(measurements, opts = {}) {
    const priceBook = opts.priceBook || {};
    const scopes = Object.assign({ roof: true }, opts.scopes || {});
    const covered = coveredKeys(opts.adjusterText || '');
    for (const c of EXTRA_COVERAGE) if (c.rx.test(opts.adjusterText || '')) covered.add(c.key);
    const overrides = opts.qtyOverrides || {};
    const defs = ITEMS.concat(EXTRA_ITEMS.filter((d) => scopes[d.scope]));
    const items = [];
    for (const def of defs) {
      let qty = def.key in overrides ? +overrides[def.key] : +def.qty(measurements).toFixed(2);
      if (!qty || qty <= 0) continue;
      const price = +(priceBook[def.key] || PRICE_DEFAULTS[def.key] || 0);
      items.push({
        key: def.key, name: def.name, unit: def.unit, trade: def.trade,
        scope: def.scope || 'roof', phase: def.phase || phaseFor(def.trade),
        qty, price, total: +(qty * price).toFixed(2),
        adjusterCovered: covered.has(def.key),
      });
    }
    // build-ordered: sort supplement candidates by phase, keep stable order
    const phaseIdx = (p) => PHASES.indexOf(p);
    const visible = opts.includeCovered ? items : items.filter((i) => !i.adjusterCovered);
    visible.sort((a, b) => phaseIdx(a.phase) - phaseIdx(b.phase));
    const subtotal = +visible.reduce((s, i) => s + i.total, 0).toFixed(2);
    const { opLines, trades } = applyOP(visible, subtotal);
    const total = +(subtotal + opLines.reduce((s, l) => s + l.total, 0)).toFixed(2);
    return {
      items: visible, opLines, subtotal, total, trades,
      scopes: Object.keys(scopes).filter((k) => scopes[k]),
      coveredCount: items.filter((i) => i.adjusterCovered).length,
    };
  }

  function phaseFor(trade) {
    if (trade === 'admin') return 'admin';
    if (trade === 'equipment') return 'demolition';
    return 'roofing';
  }

  // Derive working measurements from raw EagleView-style numbers.
  // wastePct comes from the report's "Suggested" waste column (manual override
  // always available). Squares round UP to the nearest 1/3 SQ per EagleView.
  function deriveMeasurements(raw) {
    const waste = (raw.wastePct || 10) / 100;
    const roofSQ = roundUp3(((raw.totalSqFt || 0) / 100) * (1 + waste));
    return {
      totalSqFt: raw.totalSqFt || 0,
      wastePct: raw.wastePct || 10,
      pitch: raw.pitch || '',
      roofSQ,
      ridgesLF: raw.ridgesLF || 0,
      hipsLF: raw.hipsLF || 0,
      valleysLF: raw.valleysLF || 0,
      rakesLF: raw.rakesLF || 0,
      eavesLF: raw.eavesLF || 0,
      stepFlashingLF: raw.stepFlashingLF || 0,
      wallFlashingLF: raw.wallFlashingLF || 0,
      pipeCount: raw.pipeCount || 0,
      chimneyCount: raw.chimneyCount || 0,
      skylightCount: raw.skylightCount || 0,
      satelliteCount: raw.satelliteCount || 0,
      starterLF: raw.eavesLF || 0,
      dripEdgeLF: (raw.eavesLF || 0) + (raw.rakesLF || 0),
      ridgeCapLF: (raw.ridgesLF || 0) + (raw.hipsLF || 0),
      shinglesSQ: roofSQ,
      // extended: whole-property scopes (all optional, default 0)
      sidingSQ: raw.sidingSQ || 0,
      soffitLF: raw.soffitLF || 0,
      fasciaLF: raw.fasciaLF || 0,
      guttersLF: raw.guttersLF || 0,
      downspoutsLF: raw.downspoutsLF || 0,
      sidingDetachSQ: raw.sidingDetachSQ || 0,
      fenceLF: raw.fenceLF || 0,
      drywallSQ: raw.drywallSQ || 0,
      paintRooms: raw.paintRooms || 0,
      paintColors: raw.paintColors || 0,
      treeCount: raw.treeCount || 0,
      tarpSQ: raw.tarpSQ || 0,
      siteCleanup: !!raw.siteCleanup,
      detachedCount: raw.detachedCount || 0,
      yearBuilt: raw.yearBuilt || 0,
      telehandlerDays: raw.telehandlerDays || 0,
    };
  }

  return { ITEMS, COVERAGE, roundUp3, coveredKeys, applyOP, buildSupplement, deriveMeasurements,
    SCOPES, PHASES, PHASE_NAMES, PRICE_DEFAULTS, EXTRA_ITEMS, EXTRA_COVERAGE, AUDIT_RULES, runAudit };
});
